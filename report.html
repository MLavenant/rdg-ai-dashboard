<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RDG AI Impact — Executive Report</title>
<style>
:root{
  --text:#1a1d2e;--muted:#5a6280;--line:#d8dce8;--bg:#fff;
  --up:#0d7a45;--dn:#b42318;--ai:#6b3fa0;--accent:#1d4ed8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,"Times New Roman",serif;color:var(--text);background:#e8eaf0;font-size:12px;line-height:1.45}
.toolbar{position:sticky;top:0;z-index:20;background:#141720;color:#eef0fb;padding:10px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toolbar a,.toolbar button{background:#3d8ef8;color:#fff;border:none;border-radius:6px;padding:7px 12px;font:600 12px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.toolbar .hint{color:#8890b8;font:12px system-ui,sans-serif;margin-left:auto}
.sheet{max-width:8.5in;margin:16px auto;background:var(--bg);padding:0.55in 0.6in;box-shadow:0 2px 16px rgba(0,0,0,.12)}
.page-break{page-break-after:always;break-after:page}
h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
h2{font-size:15px;margin:14px 0 8px;color:var(--accent)}
h3{font-size:12px;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.meta{color:var(--muted);font-size:11px;margin-top:4px;font-family:system-ui,sans-serif}
.verdict{margin:12px 0;padding:10px 12px;border-left:3px solid var(--accent);background:#f4f6fb;font-size:12.5px}
.verdict b{font-weight:700}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.kpi .l{font:600 9px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.kpi .v{font-size:18px;font-weight:700;margin-top:2px}
.kpi .s{font:11px system-ui,sans-serif;color:var(--muted);margin-top:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.flag{color:var(--dn);font-weight:700}
table{width:100%;border-collapse:collapse;font:11px system-ui,sans-serif;margin:6px 0 10px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:600;font-size:9px;text-transform:uppercase;letter-spacing:.03em}
td:first-child,th:first-child{text-align:left}
tr.total td{font-weight:700;border-top:2px solid var(--text)}
.note{font:10px system-ui,sans-serif;color:var(--muted);margin-top:8px}
.footer{margin-top:16px;padding-top:8px;border-top:1px solid var(--line);font:10px system-ui,sans-serif;color:var(--muted);display:flex;justify-content:space-between}
@media print{
  body{background:#fff}
  .toolbar{display:none!important}
  .sheet{box-shadow:none;margin:0;max-width:none;padding:0.4in 0.5in}
  .page-break{page-break-after:always}
  a{color:inherit;text-decoration:none}
}
@page{size:letter;margin:0.45in}
</style>
</head>
<body>
<div class="toolbar" id="toolbar">
  <button type="button" onclick="window.print()">Print / Save PDF</button>
  <a href="./">← Dashboard</a>
  <span class="hint">For automation: <code>npm run report:pdf</code></span>
</div>
<div id="root"><div class="sheet" style="text-align:center;padding:2in;color:#5a6280">Loading executive report…</div></div>

<script>
const ANALYSIS_START_WEEK = 11;
const RESTS = [
  {id:'mila', label:'MILA', goLive:23},
  {id:'casa_neos', label:'Casa Neos', goLive:23},
  {id:'ava_cg', label:'AVA CG', goLive:19},
  {id:'ava_wp', label:'AVA WP', goLive:23},
  {id:'claudie', label:'Claudie', goLive:20},
];

const sum = (rows, f) => rows.reduce((s, r) => s + (r[f] || 0), 0);
const signedPct = (cur, prior) => (prior > 0 ? ((cur - prior) / prior) * 100 : null);
const fmtSigned = (v) => {
  if (v == null || isNaN(v)) return '—';
  const sign = v > 0 ? '+' : '';
  return `${sign}${v.toFixed(1)}%`;
};
const fmtN = (n) => (n == null ? '—' : Number(n).toLocaleString());
const phoneBooks = (rows) => sum(rows, 'bookingsPhoneHuman') + sum(rows, 'bookingsPhoneAI');
const humanConv = (rows) => {
  const h = sum(rows, 'callsHuman');
  return h > 0 ? sum(rows, 'bookingsPhoneHuman') / h * 100 : null;
};
const aiConv = (rows) => {
  const a = sum(rows, 'callsAI');
  return a > 0 ? sum(rows, 'bookingsPhoneAI') / a * 100 : null;
};
const fmtConv = (v) => {
  if (v == null || isNaN(v)) return '—';
  const s = v.toFixed(1) + '%';
  return v > 100 ? `<span class="flag">${s}⚠</span>` : s;
};
const clsVar = (v) => (v == null ? '' : v >= 0 ? 'up' : 'dn');

function scope(rows, cutoff, fromWeek) {
  return (rows || []).filter(r => r.week >= fromWeek && r.week <= cutoff);
}
function mtdScope(rows, cutoff) {
  const from = Math.max(ANALYSIS_START_WEEK, cutoff - 3);
  return scope(rows, cutoff, from);
}
function ytdScope(rows, cutoff) {
  return scope(rows, cutoff, ANALYSIS_START_WEEK);
}
function forRest(rows, id) {
  return (rows || []).filter(r => r.restaurantId === id);
}

function channelRows(r26, r25) {
  const src = [
    { key: 'bookingsPhoneHuman', label: 'Phone/In-House' },
    { key: 'bookingsPhoneAI', label: 'Phone/AI' },
    { key: 'bookingsOTNetwork', label: 'OT Network' },
    { key: 'bookingsYourNetwork', label: 'Your Network' },
    { key: 'bookingsWalkIn', label: 'Walk-in' },
  ];
  const ph25 = sum(r25, 'bookingsPhoneHuman');
  const ph26 = sum(r26, 'bookingsPhoneHuman');
  const phoneLoss = Math.max(0, ph25 - ph26);
  return src.map(s => {
    const a = sum(r25, s.key), b = sum(r26, s.key), d = b - a;
    let read = '—';
    if (s.key === 'bookingsPhoneHuman' && d < 0) read = `${Math.abs(d).toLocaleString()} lost vs 2025`;
    else if (phoneLoss > 0 && d > 0 && s.key !== 'bookingsPhoneHuman') {
      read = `${Math.min(100, (d / phoneLoss) * 100).toFixed(0)}% of phone loss (volume)`;
    }
    return { ...s, a, b, d, varPct: signedPct(b, a), read };
  });
}

function verdictText(r26, r25, label) {
  const cVar = signedPct(sum(r26, 'callsTotal'), sum(r25, 'callsTotal'));
  const bVar = signedPct(sum(r26, 'bookingsTotal'), sum(r25, 'bookingsTotal'));
  const ph25 = sum(r25, 'bookingsPhoneHuman');
  const ph26 = sum(r26, 'bookingsPhoneHuman');
  const ai26 = sum(r26, 'bookingsPhoneAI');
  const phoneLoss = ph25 - ph26;
  const h26 = humanConv(r26), h25 = humanConv(r25);
  const otD = sum(r26, 'bookingsOTNetwork') - sum(r25, 'bookingsOTNetwork');
  const otherD =
    (sum(r26, 'bookingsYourNetwork') + sum(r26, 'bookingsWalkIn')) -
    (sum(r25, 'bookingsYourNetwork') + sum(r25, 'bookingsWalkIn'));
  const who = label ? `<b>${label}</b>: ` : '';
  const calls = cVar == null ? 'Call volume YoY unclear' :
    (cVar >= 0 ? `Calls <b class="up">${fmtSigned(cVar)}</b>` : `Calls <b class="dn">${fmtSigned(cVar)}</b>`);
  const conv = (h26 != null && h25 != null)
    ? `Human conv ${h25.toFixed(1)}% → ${fmtConv(h26)}`
    : 'Human conv —';
  let shift;
  if (phoneLoss <= 0) {
    shift = `Phone/In-House is not down; Phone/AI +${ai26.toLocaleString()}. Total reservations <b class="${clsVar(bVar)}">${fmtSigned(bVar)}</b>.`;
  } else if (ai26 >= phoneLoss) {
    shift = `Phone/In-House −${phoneLoss.toLocaleString()} fully offset by Phone/AI (+${ai26.toLocaleString()}). Total reservations <b class="${clsVar(bVar)}">${fmtSigned(bVar)}</b> — phone mix shifted, not necessarily lost.`;
  } else if (bVar != null && bVar >= 0) {
    shift = `Phone/In-House −${phoneLoss.toLocaleString()}; AI recovered ${ai26.toLocaleString()} (${((ai26 / phoneLoss) * 100).toFixed(0)}%). Other channels (OT ${otD >= 0 ? '+' : ''}${otD.toLocaleString()}, web/walk-in ${otherD >= 0 ? '+' : ''}${otherD.toLocaleString()}) absorbed volume. <b>Net reservations not down</b> (${fmtSigned(bVar)}). Accounting only — not guest-level proof of transfer.`;
  } else {
    shift = `Phone/In-House −${phoneLoss.toLocaleString()}; AI recovered only ${ai26.toLocaleString()}. OT ${otD >= 0 ? '+' : ''}${otD.toLocaleString()}, web/walk-in ${otherD >= 0 ? '+' : ''}${otherD.toLocaleString()}. Total reservations <b class="dn">${fmtSigned(bVar)}</b> — <b>net leak</b>; channel gains do not fully offset losses.`;
  }
  return `${who}${calls}. ${conv}. ${shift}`;
}

function kpiBlock(r26, r25) {
  const c26 = sum(r26, 'callsTotal'), c25 = sum(r25, 'callsTotal');
  const b26 = sum(r26, 'bookingsTotal'), b25 = sum(r25, 'bookingsTotal');
  const p26 = phoneBooks(r26), p25 = phoneBooks(r25);
  const h26 = humanConv(r26), h25 = humanConv(r25);
  const cV = signedPct(c26, c25), bV = signedPct(b26, b25), pV = signedPct(p26, p25);
  return `<div class="kpi-grid">
    <div class="kpi"><div class="l">Calls 2026</div><div class="v">${fmtN(c26)}</div><div class="s ${clsVar(cV)}">vs PY ${fmtSigned(cV)} · ${fmtN(c25)}</div></div>
    <div class="kpi"><div class="l">Reservations 2026</div><div class="v">${fmtN(b26)}</div><div class="s ${clsVar(bV)}">vs PY ${fmtSigned(bV)} · ${fmtN(b25)}</div></div>
    <div class="kpi"><div class="l">Phone books 2026</div><div class="v">${fmtN(p26)}</div><div class="s ${clsVar(pV)}">vs PY ${fmtSigned(pV)} · ${fmtN(p25)}</div></div>
    <div class="kpi"><div class="l">Human conv 2026</div><div class="v">${fmtConv(h26)}</div><div class="s">2025: ${fmtConv(h25)} · Phone/IH ÷ Human calls</div></div>
  </div>`;
}

function channelTable(r26, r25) {
  const rows = channelRows(r26, r25);
  const t25 = sum(r25, 'bookingsTotal'), t26 = sum(r26, 'bookingsTotal');
  const td = t26 - t25;
  const body = rows.map(r => `<tr>
    <td>${r.label}</td><td>${fmtN(r.a)}</td><td>${fmtN(r.b)}</td>
    <td class="${clsVar(r.varPct)}">${fmtSigned(r.varPct)} (${r.d >= 0 ? '+' : ''}${fmtN(r.d)})</td>
    <td style="text-align:left">${r.read}</td>
  </tr>`).join('');
  return `<table>
    <thead><tr><th>Source</th><th>2025</th><th>2026</th><th>YoY</th><th>Transfer read (volume)</th></tr></thead>
    <tbody>${body}
      <tr class="total"><td>Total reservations</td><td>${fmtN(t25)}</td><td>${fmtN(t26)}</td>
        <td class="${clsVar(signedPct(t26, t25))}">${fmtSigned(signedPct(t26, t25))} (${td >= 0 ? '+' : ''}${fmtN(td)})</td>
        <td style="text-align:left">${td >= 0 ? 'Net OK — total not down' : `Net leak — still ${fmtN(td)} vs 2025`}</td>
      </tr>
    </tbody>
  </table>
  <div class="note">Transfer read = how much of the Phone/In-House loss magnitude appears as gains elsewhere. Does not prove the same guest moved channels.</div>`;
}

function periodLine(label, r26, r25) {
  const cV = signedPct(sum(r26, 'callsTotal'), sum(r25, 'callsTotal'));
  const bV = signedPct(sum(r26, 'bookingsTotal'), sum(r25, 'bookingsTotal'));
  const pV = signedPct(phoneBooks(r26), phoneBooks(r25));
  const h26 = humanConv(r26), h25 = humanConv(r25);
  return `<b>${label}</b>: calls <b class="${clsVar(cV)}">${fmtSigned(cV)}</b>, reservations <b class="${clsVar(bV)}">${fmtSigned(bV)}</b>, phone books <b class="${clsVar(pV)}">${fmtSigned(pV)}</b>, human conv ${fmtConv(h25)} → ${fmtConv(h26)}.`;
}

function restSummaryTable(D) {
  const cutoff = D.cutoff;
  const rows = RESTS.map(rest => {
    const r26 = ytdScope(forRest(D.rows26, rest.id), cutoff);
    const r25 = ytdScope(forRest(D.rows25, rest.id), cutoff);
    const bV = signedPct(sum(r26, 'bookingsTotal'), sum(r25, 'bookingsTotal'));
    const cV = signedPct(sum(r26, 'callsTotal'), sum(r25, 'callsTotal'));
    const phLoss = sum(r25, 'bookingsPhoneHuman') - sum(r26, 'bookingsPhoneHuman');
    return `<tr>
      <td>${rest.label} <span style="color:var(--muted)">(AI W${rest.goLive})</span></td>
      <td class="${clsVar(cV)}">${fmtSigned(cV)}</td>
      <td class="${clsVar(bV)}">${fmtSigned(bV)}</td>
      <td>${phLoss > 0 ? '−' + fmtN(phLoss) : phLoss < 0 ? '+' + fmtN(-phLoss) : '0'}</td>
      <td>${fmtConv(humanConv(r26))}</td>
      <td>${fmtN(sum(r26, 'bookingsPhoneAI'))}</td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr><th>Location</th><th>Calls YoY</th><th>Res YoY</th><th>Phone/IH Δ</th><th>Human Conv</th><th>Phone/AI</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderPage(title, subtitle, bodyHtml, pageNum, totalPages) {
  return `<section class="sheet page-break">
    <h1>${title}</h1>
    <div class="meta">${subtitle}</div>
    ${bodyHtml}
    <div class="footer"><span>RDG AI Impact · Confidential</span><span>Page ${pageNum} / ${totalPages}</span></div>
  </section>`;
}

function buildReport(D) {
  const cutoff = D.cutoff;
  const mtdFrom = Math.max(ANALYSIS_START_WEEK, cutoff - 3);
  const y26 = ytdScope(D.rows26, cutoff), y25 = ytdScope(D.rows25, cutoff);
  const m26 = mtdScope(D.rows26, cutoff), m25 = mtdScope(D.rows25, cutoff);
  const generated = new Date().toLocaleString();
  const totalPages = 1 + RESTS.length;

  const overallBody = `
    <div class="verdict">${periodLine(`MTD W${mtdFrom}–W${cutoff}`, m26, m25)}<br>${periodLine(`YTD W${ANALYSIS_START_WEEK}–W${cutoff}`, y26, y25)}</div>
    <div class="verdict">${verdictText(y26, y25, 'Overall')}</div>
    <h2>YTD key metrics</h2>
    ${kpiBlock(y26, y25)}
    <h2>Channel transfer (YTD volume)</h2>
    ${channelTable(y26, y25)}
    <h2>By restaurant — YTD snapshot</h2>
    ${restSummaryTable(D)}
    <div class="note">⚠ Conversion &gt;100% = OT Phone/In-House bookings exceeded TalkDesk human calls (timing/tagging) — not a true conversion. Formula: Phone/In-House ÷ Human Calls.</div>
    <div class="note">Generated ${generated} · Data through W${cutoff} · Dashboard: https://mlavenant.github.io/rdg-ai-dashboard/</div>
  `;

  let html = renderPage(
    'RDG AI Impact — Executive Report',
    `Overall · Weeks ${ANALYSIS_START_WEEK}–${cutoff} · 2026 vs same weeks 2025`,
    overallBody,
    1,
    totalPages
  );

  RESTS.forEach((rest, i) => {
    const r26 = ytdScope(forRest(D.rows26, rest.id), cutoff);
    const r25 = ytdScope(forRest(D.rows25, rest.id), cutoff);
    const rm26 = mtdScope(forRest(D.rows26, rest.id), cutoff);
    const rm25 = mtdScope(forRest(D.rows25, rest.id), cutoff);
    const body = `
      <div class="verdict">${periodLine(`MTD W${mtdFrom}–W${cutoff}`, rm26, rm25)}<br>${periodLine(`YTD W${ANALYSIS_START_WEEK}–W${cutoff}`, r26, r25)}</div>
      <div class="verdict">${verdictText(r26, r25, rest.label)}</div>
      <h2>YTD key metrics</h2>
      ${kpiBlock(r26, r25)}
      <h3>AI Live W${rest.goLive} · Human ${fmtN(sum(r26,'callsHuman'))} · AI calls ${fmtN(sum(r26,'callsAI'))} · AI conv ${fmtConv(aiConv(r26))}</h3>
      <h2>Channel transfer (YTD volume)</h2>
      ${channelTable(r26, r25)}
      <div class="note">Accounting view only. Positive OT/walk-in/AI does not prove guests transferred from phone.</div>
    `;
    html += renderPage(
      rest.label,
      `AI Impact · AI Live W${rest.goLive} · YTD W${ANALYSIS_START_WEEK}–W${cutoff} vs 2025`,
      body,
      i + 2,
      totalPages
    );
  });

  // last page should not force blank trailing page — strip last page-break class
  html = html.replace(/page-break(?=[^]*$)/, '');
  return html;
}

async function loadCompare() {
  const onStatic = /github\.io$/i.test(location.hostname) || location.protocol === 'file:';
  if (!onStatic) {
    try {
      const r = await fetch('/api/compare');
      if (r.ok) {
        const j = await r.json();
        if (j?.rows26) return j;
      }
    } catch (_) {}
  }
  const r2 = await fetch('./compare.json?ts=' + Date.now());
  if (!r2.ok) throw new Error('Could not load compare data');
  return r2.json();
}

(async () => {
  try {
    const D = await loadCompare();
    document.getElementById('root').innerHTML = buildReport(D);
    document.title = `RDG AI Exec Report — W${D.cutoff}`;
    document.documentElement.setAttribute('data-ready', '1');
  } catch (e) {
    document.getElementById('root').innerHTML =
      `<div class="sheet"><h1>Report failed</h1><p>${e.message}</p></div>`;
  }
})();
</script>
</body>
</html>
