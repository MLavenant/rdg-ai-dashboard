<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RDG AI Impact Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#0d0f18;--surface:#141720;--surface2:#1a1f30;--border:#252d4a;
  --text:#eef0fb;--muted:#8890b8;
  --y25:#ff9f2e;      /* vivid amber — 2025 */
  --y26:#3d8ef8;      /* vivid blue — 2026 */
  --ai:#b06ef5;       /* vivid purple — AI */
  --human:#22d98e;    /* vivid green — Human */
  --red:#ff5c6a;--green:#22d98e;
  --c-mila:#3d8ef8;   /* blue */
  --c-casa:#b06ef5;   /* purple */
  --c-avacg:#22d98e;  /* green */
  --c-avawp:#ff9f2e;  /* amber */
  --c-claudie:#f43f8e;/* pink */
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;min-height:100vh}

/* ── NAV ── */
.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:32px;height:52px;position:sticky;top:0;z-index:100}
.nav-brand{font-weight:700;font-size:15px;color:var(--text);white-space:nowrap}
.nav-brand span{color:var(--ai);margin-right:6px}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab-btn{padding:6px 16px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;border-radius:6px;transition:.15s}
.tab-btn:hover{background:var(--surface2);color:var(--text)}
.tab-btn.active{background:var(--surface2);color:var(--y26);font-weight:600}

/* ── FILTERS ── */
.filters{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.filter-group{display:flex;align-items:center;gap:8px}
.filter-label{color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
select,input[type=number]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--y26)}
.filter-sep{width:1px;height:20px;background:var(--border)}
.last-update{margin-left:auto;color:var(--muted);font-size:11px}

/* ── LAYOUT ── */
.page{display:none;padding:20px 24px;max-width:1600px;margin:0 auto}
.page.active{display:block}

/* ── KPI CARDS ── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative}
.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-size:26px;font-weight:700;line-height:1}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:4px}
.kpi-badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.badge-up{background:rgba(74,222,128,.15);color:var(--green)}
.badge-dn{background:rgba(248,113,113,.15);color:var(--red)}
.badge-neu{background:rgba(167,139,250,.15);color:var(--ai)}
.kpi-split{display:flex;gap:12px;margin-top:6px}
.kpi-split-item{font-size:11px}
.kpi-split-item b{display:block;font-size:15px;font-weight:700}

/* ── CHART GRID ── */
.chart-row{display:grid;gap:16px;margin-bottom:16px}
.chart-row.cols-2{grid-template-columns:1fr 1fr}
.chart-row.cols-3{grid-template-columns:1fr 1fr 1fr}
.chart-row.cols-1{grid-template-columns:1fr}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.chart-card h3{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.chart-card p{font-size:11px;color:var(--muted);margin-bottom:12px}
.chart-wrap{position:relative}
.ov-ai-impact-table{margin-top:14px;overflow-x:auto;border-top:1px solid var(--border);padding-top:12px}
.ov-ai-impact-table .exec-kpi-table{min-width:680px;width:100%;border-collapse:separate;border-spacing:0 6px}
.ov-ai-impact-table .exec-kpi-table thead th{border-bottom:none;padding:6px 12px 8px}
.ov-ai-impact-table .exec-kpi-table th,.ov-ai-impact-table .exec-kpi-table td{padding:10px 12px;font-size:12px}
.ov-ai-impact-table .exec-kpi-table td b{font-size:13px}
.ov-ai-impact-table .exec-kpi-table thead tr.group-row th.group-calls{color:#3d8ef8;border-bottom:2px solid rgba(61,142,248,.55)}
.ov-ai-impact-table .exec-kpi-table thead tr.group-row th.group-phone{color:#b06ef5;border-bottom:2px solid rgba(176,110,245,.55)}
.ov-ai-impact-table .exec-kpi-table thead tr.sub-row th{padding-top:4px;font-size:10px;letter-spacing:.3px}
.ov-ai-impact-table .exec-kpi-table tbody tr{background:rgba(20,23,32,.92);box-shadow:inset 3px 0 0 var(--row-accent, #3d8ef8)}
.ov-ai-impact-table .exec-kpi-table tbody tr td{border-top:1px solid rgba(42,48,80,.85);border-bottom:1px solid rgba(42,48,80,.85)}
.ov-ai-impact-table .exec-kpi-table tbody tr td:first-child{border-left:1px solid rgba(42,48,80,.85);border-radius:8px 0 0 8px}
.ov-ai-impact-table .exec-kpi-table tbody tr td:last-child{border-right:1px solid rgba(42,48,80,.85);border-radius:0 8px 8px 0}
.ov-ai-impact-table .exec-kpi-table tbody tr:hover{background:var(--surface2)}
.ov-ai-impact-table .exec-kpi-table tbody tr.total-row{background:rgba(61,142,248,.10);box-shadow:inset 3px 0 0 #eef0fb}
.ov-ai-impact-table .loc-cell{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.ov-ai-impact-table .loc-cell .loc-name{font-weight:700;font-size:13px}
.ov-ai-impact-table .loc-cell .loc-meta{font-size:10px;color:var(--muted);font-weight:500}
.ov-ai-impact-table .compare-pair{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ov-ai-impact-table .compare-arrow{color:var(--muted);font-size:11px;font-weight:600}
.ov-ai-impact-table .change-cell{white-space:nowrap}
.ov-ai-impact-table .yoy-hint{font-size:10px;font-weight:500;margin-left:4px}
.ov-ai-impact-table .sep-col{border-left:1px solid rgba(42,48,80,.9)!important}

/* ── TABLES ── */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;overflow-x:auto}
.table-card h3{font-size:13px;font-weight:600;margin-bottom:12px}
.exec-kpi-card{border:1px solid rgba(61,142,248,.35);background:linear-gradient(180deg,rgba(61,142,248,.08),var(--surface))}
.overview-scorecard{border:1px solid var(--border);background:var(--surface)}
.overview-scorecard h3{display:flex;align-items:center;gap:10px;margin-bottom:10px;width:100%}
.overview-scorecard h3::after{content:'';flex:1;height:1px;background:var(--border)}
.overview-scorecard .report-blurb{max-width:none}
#overview-pdf-root > .chart-card h3{display:flex;align-items:center;gap:10px;width:100%}
#overview-pdf-root > .chart-card h3::after{content:'';flex:1;height:1px;background:var(--border)}
#overview-pdf-root > .chart-card .report-blurb{max-width:none}
.overview-scorecard .exec-kpi-table{table-layout:fixed;width:100%;min-width:1100px}
.overview-scorecard .exec-kpi-table th:first-child,
.overview-scorecard .exec-kpi-table td:first-child{width:84px;padding-left:10px;padding-right:8px}
.overview-scorecard .exec-kpi-table th:not(:first-child),
.overview-scorecard .exec-kpi-table td:not(:first-child){padding:11px 7px;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.overview-scorecard .exec-kpi-table td b{font-size:13px}
.overview-scorecard .exec-kpi-table thead tr.sub-row th{font-size:9px;letter-spacing:.2px;padding-top:8px;padding-bottom:8px}
.overview-scorecard .exec-kpi-table thead tr.group-row th{padding-bottom:6px}
.overview-scorecard .group-lw{color:#3d8ef8;border-bottom:2px solid rgba(61,142,248,.55)}
.overview-scorecard .group-mtd{color:#22d98e;border-bottom:2px solid rgba(34,217,142,.55)}
.overview-scorecard .group-ytd{color:#b06ef5;border-bottom:2px solid rgba(176,110,245,.55)}
.exec-kpi-table th,.exec-kpi-table td{padding:12px 14px;font-size:13px;white-space:nowrap}
.exec-kpi-table th{font-size:11px;letter-spacing:.4px}
.exec-kpi-table td b{font-size:15px;font-weight:700}
.exec-kpi-table thead tr.group-row th{text-align:center;border-bottom:none;padding-bottom:4px;font-size:12px;text-transform:none;letter-spacing:.3px;color:var(--text)}
.exec-kpi-table thead tr.group-row th.group-lw{color:#3d8ef8;border-bottom:2px solid rgba(61,142,248,.55)}
.exec-kpi-table thead tr.group-row th.group-mtd{color:#22d98e;border-bottom:2px solid rgba(34,217,142,.55)}
.exec-kpi-table thead tr.group-row th.group-ytd{color:#b06ef5;border-bottom:2px solid rgba(176,110,245,.55)}
.exec-kpi-table thead tr.sub-row th{padding-top:6px;font-size:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:8px 10px;text-align:right;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
thead th:first-child{text-align:left}
tbody tr{border-bottom:1px solid rgba(42,48,80,.5)}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:8px 10px;text-align:right;white-space:nowrap}
tbody td:first-child{text-align:left;font-weight:600}
.up{color:var(--green)}.dn{color:var(--red)}.neu{color:var(--ai)}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600}
.pill-ai{background:rgba(167,139,250,.2);color:var(--ai)}
.pill-h{background:rgba(52,211,153,.2);color:var(--human)}
tbody tr.total-row{background:rgba(61,142,248,.08);border-top:2px solid var(--border)}
tbody tr.total-row td{font-weight:700;color:var(--text)}
.loc-summary-note{font-size:11px;color:var(--muted);margin:-4px 0 14px}

/* ── BY RESTAURANT ── */
.rest-selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.rest-btn{padding:7px 16px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:20px;cursor:pointer;font-size:13px;transition:.15s}
.rest-btn:hover,.rest-btn.active{background:var(--y26);border-color:var(--y26);color:#fff;font-weight:600}
.golive-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.3);color:var(--ai);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:16px}

/* ── LEGEND ── */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.legend-dot{width:10px;height:10px;border-radius:50%}
.legend-line{width:20px;height:2px}

/* ── SECTION HEADING ── */
.section-head{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:20px 0 12px;display:flex;align-items:center;gap:8px}
.section-head::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── PERIOD SUMMARY (below charts) ── */
.period-summary{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.period-summary table{font-size:12px;width:100%}
.period-summary th,.period-summary td{padding:8px 12px;text-align:center}
.period-summary th:first-child,.period-summary td:first-child{text-align:left}
.period-summary .period-label{font-weight:600;color:var(--muted)}
.period-summary th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
.heat{display:inline-block;padding:3px 10px;border-radius:6px;font-weight:700;font-size:13px;min-width:52px}
.heat-good{background:rgba(52,211,153,.18);color:#34d399}
.heat-mid{background:rgba(251,191,36,.15);color:#fbbf24}
.heat-bad{background:rgba(248,113,113,.18);color:#f87171}
.heat-na{color:var(--muted)}
.stat-note{font-size:10px;color:var(--muted);margin-top:8px;font-style:italic}
.conv-flag{color:var(--red);font-weight:700}
.conv-footnote{font-size:11px;color:var(--muted);margin:6px 0 12px;line-height:1.45}
.conv-over{color:#fbbf24;font-weight:700;border-bottom:1px dotted rgba(251,191,36,.55);cursor:help}
.report-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.report-bar h2{font-size:18px;font-weight:700;margin:0;flex:1}
.btn-export{background:linear-gradient(90deg,#3d8ef8,#b06ef5);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
.btn-export:disabled{opacity:.55;cursor:wait}
.btn-export:hover{filter:brightness(1.08)}
@media print, screen {
  body.print-overview .nav,
  body.print-overview .filters,
  body.print-overview .no-print{display:none!important}
  body.print-overview .page{display:none!important}
  body.print-overview #page-overview{display:block!important;padding:16px;max-width:none}
  body.print-overview{background:#0d0f18!important;color:#eef0fb!important}
  body.print-overview .chart-card,
  body.print-overview .table-card,
  body.print-overview .exec-kpi-card{break-inside:avoid}
  #overview-pdf-root,
  #overview-pdf-root *{
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }
}
.report-blurb{font-size:12px;line-height:1.45;color:var(--text);margin:0 0 10px;max-width:920px}
.report-blurb b{color:var(--text);font-weight:600}
.pdf-compact .chart-wrap{height:260px!important}
.pdf-compact .chart-card{padding:12px!important;margin-bottom:8px!important}
.pdf-compact .table-card{padding:12px!important;margin-bottom:0!important}
.pdf-compact .exec-kpi-table th,.pdf-compact .exec-kpi-table td{padding:8px 10px!important;font-size:11px!important}
.pdf-compact .exec-kpi-table td b{font-size:13px!important}
.pdf-compact .report-blurb{font-size:11px!important;margin-bottom:6px!important}
.pdf-compact .loc-summary-note,.pdf-compact .stat-note{font-size:10px!important;margin:4px 0!important}
.pdf-compact .section-head{margin:0 0 6px!important;font-size:13px!important}
.pdf-compact h3{font-size:12px!important;margin-bottom:4px!important}
.overview-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.overview-toolbar .section-head{margin:0}
.insight-banner{background:linear-gradient(135deg,rgba(61,142,248,.12),rgba(176,110,245,.10));border:1px solid rgba(61,142,248,.28);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start}
.insight-banner .insight-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--ai);margin-bottom:4px}
.insight-banner .insight-text{font-size:13px;line-height:1.55;color:var(--text)}
.insight-banner .insight-mark{color:var(--ai);font-size:16px;line-height:1.2;flex-shrink:0}
.insight-banner.verdict{border-color:rgba(176,110,245,.4);background:linear-gradient(135deg,rgba(176,110,245,.14),rgba(61,142,248,.10))}
.insight-banner.verdict .insight-text + .insight-text{margin-top:6px}
.shift-absorbed{color:var(--green);font-weight:600}
.shift-leak{color:var(--red);font-weight:600}
.exercise-legend{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin:10px 0 14px;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px}
@media(max-width:900px){.exercise-legend{grid-template-columns:1fr}}
.exercise-legend .ex-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.exercise-legend p{font-size:12px;color:var(--text);line-height:1.5;margin:0 0 8px}
.exercise-legend .swatch-row{display:flex;flex-wrap:wrap;gap:8px 14px}
.exercise-legend .swatch{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.exercise-legend .swatch i{display:inline-block;width:12px;height:12px;border-radius:3px;flex-shrink:0}
.exercise-legend .swatch i.line{height:2px;width:18px;border-radius:0;align-self:center}
.exercise-legend .swatch i.line.dash{background:repeating-linear-gradient(90deg,#ff9f2e 0 4px,transparent 4px 7px)!important;height:2px}

/* ── LOADING ── */
.loading{text-align:center;padding:80px;color:var(--muted);font-size:15px}
.error{text-align:center;padding:40px;color:var(--red)}

/* ── CONVERSATION BUILDING ── */
.conv-build{max-width:720px;margin:48px auto;padding:36px 40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);text-align:center}
.conv-build .pulse{width:56px;height:56px;margin:0 auto 20px;border-radius:50%;background:rgba(176,110,245,.15);border:2px solid rgba(176,110,245,.45);display:flex;align-items:center;justify-content:center;font-size:22px;animation:convPulse 1.6s ease-in-out infinite}
@keyframes convPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(176,110,245,.35)}50%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(176,110,245,0)}}
.conv-build h2{font-size:22px;font-weight:700;margin-bottom:8px;background:linear-gradient(90deg,#3d8ef8,#b06ef5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.conv-build .status{font-size:14px;color:var(--ai);font-weight:600;margin-bottom:14px}
.conv-build p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.conv-build .scope{margin-top:18px;padding:12px 16px;background:var(--surface2);border-radius:10px;font-size:12px;color:var(--text);text-align:left}
.conv-build .scope b{color:var(--ai)}

/* ── SETTINGS / SANITY ── */
.sanity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media(max-width:900px){.sanity-grid{grid-template-columns:1fr}}
.sanity-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.sanity-card h3{font-size:14px;margin-bottom:6px}
.sanity-card .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;margin-bottom:8px}
.badge-ok{background:rgba(52,211,153,.18);color:#34d399}
.badge-warn{background:rgba(251,191,36,.15);color:#fbbf24}
.badge-fail{background:rgba(248,113,113,.18);color:#f87171}
.sanity-card ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.5}
.sanity-card .summary{font-size:13px;color:var(--text)}
.checklist-table td:first-child{font-weight:600}
code.cmd{font-size:11px;background:var(--surface2);padding:2px 6px;border-radius:4px;color:var(--ai)}

/* ── CONVERSATION SAMPLE ── */
.cat-bar{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.cat-row{display:grid;grid-template-columns:180px 1fr 40px;gap:10px;align-items:center;font-size:12px}
.cat-track{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.cat-fill{height:100%;background:linear-gradient(90deg,#3d8ef8,#b06ef5);border-radius:999px}
.conv-table a{color:var(--ai);text-decoration:none}
.conv-table a:hover{text-decoration:underline}
.pill-cat{background:rgba(176,110,245,.18);color:var(--ai)}

/* ── PATTERN / LLM / PEOPLE ── */
.pattern-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.pattern-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.pattern-card h4{font-size:12px;font-weight:700;margin-bottom:6px}
.pattern-card p{font-size:12px;color:var(--muted);line-height:1.5}
.pattern-card.sev-high{border-color:rgba(248,113,113,.35)}
.pattern-card.sev-medium{border-color:rgba(251,191,36,.3)}

<script>
// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let D = null;          // raw /api/compare response
let F = {};            // current filter state
const CHARTS = {};     // chart instances keyed by canvas id
if (typeof ChartDataLabels !== 'undefined') {
  Chart.register(ChartDataLabels);
  Chart.defaults.plugins.datalabels = { display: false };
}

const RESTS = [
  {id:'mila',      label:'MILA',      color:'#3d8ef8', goLive:23},
  {id:'casa_neos', label:'Casa Neos', color:'#b06ef5', goLive:23},
  {id:'ava_cg',    label:'AVA CG',    color:'#22d98e', goLive:19},
  {id:'ava_wp',    label:'AVA WP',    color:'#ff9f2e', goLive:23},
  {id:'claudie',   label:'Claudie',   color:'#f43f8e', goLive:20},
];
// Analysis window — W1–W10 excluded (incomplete TalkDesk / booking alignment in early 2025)
const ANALYSIS_START_WEEK = 11;

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
async function loadCompare() {
  // Local Express server first; GitHub Pages falls back to static compare.json
  const onStaticHost = /github\.io$/i.test(location.hostname) || location.protocol === 'file:';
  if (!onStaticHost) {
    try {
      const r = await fetch('/api/compare');
      if (r.ok) {
        const j = await r.json();
        if (j?.ok !== false && Array.isArray(j.rows26)) return j;
      }
    } catch (_) { /* static host */ }
  }
  let dir = location.pathname || '/';
  if (dir.endsWith('.html')) dir = dir.replace(/\/[^/]+$/, '/');
  else if (!dir.endsWith('/')) dir = dir + '/';
  const r2 = await fetch(dir + 'compare.json');
  if (!r2.ok) throw new Error('Could not load /api/compare or ./compare.json');
  return r2.json();
}

async function init() {
  try {
    D = await loadCompare();
    document.getElementById('f-wk-from').value = ANALYSIS_START_WEEK;
    document.getElementById('f-wk-to').value = D.cutoff;
    document.getElementById('last-update').textContent = `Updated W${D.cutoff} · Analysis from W${ANALYSIS_START_WEEK}`;
    F = { location:'all', wkFrom:ANALYSIS_START_WEEK, wkTo:D.cutoff, year:'both' };
    renderAll();
  } catch(e) {
    document.querySelectorAll('.page').forEach(p => p.innerHTML = `<div class="error">Error loading data: ${e.message}</div>`);
  }
}

function applyFilters() {
  F.location = document.getElementById('f-location').value;
  F.wkFrom   = Math.max(ANALYSIS_START_WEEK, +document.getElementById('f-wk-from').value || ANALYSIS_START_WEEK);
  F.wkTo     = +document.getElementById('f-wk-to').value || D.cutoff;
  F.year     = document.getElementById('f-year').value;
  renderAll();
}

function renderAll() {
  renderOverview();
  renderByRest();
  renderPeople();
  renderReservations();
  renderConversation();
  renderSettings();
}

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════
function filtered(rows, year=null) {
  if (!rows) return [];
  return rows.filter(r => {
    if (F.location !== 'all' && r.restaurantId !== F.location) return false;
    if (r.week < F.wkFrom || r.week > F.wkTo) return false;
    if (year && r.year !== year) return false;
    return true;
  });
}

// Week-only filter — ignores location dropdown (used in All Restaurants comparison)
function filteredWeeks(rows) {
  if (!rows) return [];
  return rows.filter(r => r.week >= F.wkFrom && r.week <= F.wkTo);
}

// Metric formulas (same for 2025 & 2026):
//   Human Calls = total calls where agent ≠ If-No-Answer Agent and agent ≠ empty  → callsHuman
//   AI Calls    = total calls where agent = If-No-Answer Agent only               → callsAI
//   Human Conv% = Phone/In-House bookings ÷ Human Calls
//   AI Conv%    = Phone/AI bookings ÷ AI Calls (TalkDesk If-No-Answer)
//   AI Conv% (resolved) = Phone/AI bookings ÷ Hostie AI resolved (not transferred)
//   Total Conv% = (Phone/In-House + Phone/AI) ÷ (Human Calls + AI Calls)
//   Transfer%   = Hostie transferred ÷ Hostie AI calls
// OT Phone/In-House can exceed TalkDesk humanAnswered (attribution mismatch).
// Show the true rate (may exceed 100%) and flag those cells — do not fake 100%.

function convPctRaw(v) {
  if (v == null || isNaN(v)) return v;
  return Math.max(0, v);
}
/** Soft ceiling only where a chart axis needs it — prefer convPctRaw for metrics. */
function clampConvPct(v) {
  return convPctRaw(v);
}

function humanConvRate(row) {
  if (!row) return null;
  const h = row.callsHuman || 0;
  return h > 0 ? convPctRaw((row.bookingsPhoneHuman || 0) / h * 100) : null;
}
function humanConvRateAgg(rows) {
  const books = sum(rows, 'bookingsPhoneHuman');
  const h = sum(rows, 'callsHuman');
  return h > 0 ? convPctRaw(books / h * 100) : 0;
}
function aiConvRate(row) {
  if (!row) return null;
  const ai = row.callsAI || 0;
  return ai > 0 ? convPctRaw((row.bookingsPhoneAI || 0) / ai * 100) : null;
}
function aiConvRateAgg(rows) {
  const books = sum(rows, 'bookingsPhoneAI');
  const ai = sum(rows, 'callsAI');
  return ai > 0 ? convPctRaw(books / ai * 100) : 0;
}
/** Phone/AI bookings ÷ Hostie conversations that were not transferred (resolved). */
function aiConvResolvedRateAgg(rows) {
  const books = sum(rows, 'bookingsPhoneAI');
  const resolved = sum(rows, 'hostieAiResolved');
  return resolved > 0 ? convPctRaw(books / resolved * 100) : null;
}
/** Phone/AI bookings ÷ all TalkDesk calls (share of total call volume). */
function aiConvOfTotalCallsAgg(rows) {
  const books = sum(rows, 'bookingsPhoneAI');
  const tot = sum(rows, 'callsTotal');
  return tot > 0 ? convPctRaw(books / tot * 100) : null;
}
function totalConvRate(row) {
  if (!row) return null;
  const denom = (row.callsHuman || 0) + (row.callsAI || 0);
  return denom > 0 ? convPctRaw(((row.bookingsPhoneHuman || 0) + (row.bookingsPhoneAI || 0)) / denom * 100) : null;
}
function totalConvRateAgg(rows) {
  const books = sum(rows, 'bookingsPhoneHuman') + sum(rows, 'bookingsPhoneAI');
  const denom = sum(rows, 'callsHuman') + sum(rows, 'callsAI');
  return denom > 0 ? convPctRaw(books / denom * 100) : 0;
}

// Hostie transfer rate: "Transferred to Host" = TRUE ÷ total Hostie AI calls (by location)
function hostieTransferRate(row) {
  if (!row) return null;
  const ai = row.hostieAiCalls || 0;
  return ai > 0 ? (row.hostieTransferred || 0) / ai * 100 : null;
}
function hostieTransferRateAgg(rows) {
  const ai = sum(rows, 'hostieAiCalls');
  const tr = sum(rows, 'hostieTransferred');
  return ai > 0 ? tr / ai * 100 : null;
}
function hostieResolveRateAgg(rows) {
  const ai = sum(rows, 'hostieAiCalls');
  const res = sum(rows, 'hostieAiResolved');
  return ai > 0 ? res / ai * 100 : null;
}
function fmtHostiePct(v) {
  return v != null && !isNaN(v) ? v.toFixed(1) + '%' : '—';
}

function insightBanner(text) {
  if (!text) return '';
  return `<div class="insight-banner"><div class="insight-mark">◆</div><div><div class="insight-label">AI Impact Snapshot</div><div class="insight-text">${text}</div></div></div>`;
}

function signedPct(cur, prior) {
  if (!(prior > 0)) return null;
  return ((cur - prior) / prior) * 100;
}
function fmtSigned(v, unit='%') {
  if (v == null || isNaN(v)) return '—';
  const sign = v > 0 ? '+' : '';
  return `${sign}${v.toFixed(1)}${unit}`;
}

/** Sharp 1–2 line YoY verdict: calls, conversion, phone→AI/other transfer */
function buildYoyVerdict(r26, r25) {
  const c26 = sum(r26, 'callsTotal'), c25 = sum(r25, 'callsTotal');
  const cVar = signedPct(c26, c25);
  const b26 = sum(r26, 'bookingsTotal'), b25 = sum(r25, 'bookingsTotal');
  const bVar = signedPct(b26, b25);
  const ph25 = sum(r25, 'bookingsPhoneHuman');
  const ph26 = sum(r26, 'bookingsPhoneHuman');
  const ai26 = sum(r26, 'bookingsPhoneAI');
  const phoneLoss = ph25 - ph26; // >0 = lost human phone books
  const h26 = humanConvRateAgg(r26), h25 = humanConvRateAgg(r25);
  const convDelta = h26 - h25;
  const otDelta = sum(r26, 'bookingsOTNetwork') - sum(r25, 'bookingsOTNetwork');
  const otherDelta =
    (sum(r26, 'bookingsYourNetwork') + sum(r26, 'bookingsWalkIn')) -
    (sum(r25, 'bookingsYourNetwork') + sum(r25, 'bookingsWalkIn'));

  const callsTxt = cVar == null
    ? 'Call volume YoY is unclear'
    : (cVar >= 0
      ? `Calls are <b>up ${fmtSigned(cVar)}</b> vs same weeks 2025`
      : `Calls are <b>down ${fmtSigned(cVar)}</b> vs same weeks 2025`);
  const convTxt = Math.abs(convDelta) < 1
    ? `Human conversion is <b>held</b> (${h25.toFixed(1)}% → ${h26.toFixed(1)}%)`
    : (convDelta >= 0
      ? `Human conversion is <b>protected</b> (${h25.toFixed(1)}% → ${h26.toFixed(1)}%, +${convDelta.toFixed(1)}pp)`
      : `Human conversion is <b>down ${Math.abs(convDelta).toFixed(1)}pp</b> (${h25.toFixed(1)}% → ${h26.toFixed(1)}%)`);

  let shiftTxt;
  if (phoneLoss <= 0) {
    shiftTxt = `Phone/In-House is <b>not down</b> YoY; Phone/AI added <b>${ai26.toLocaleString()}</b>. Total reservations <b>${fmtSigned(bVar)}</b> — AI is not costing reservations.`;
  } else if (ai26 >= phoneLoss) {
    shiftTxt = `Phone/In-House dropped <b>${phoneLoss.toLocaleString()}</b>, fully offset by Phone/AI (<b>${ai26.toLocaleString()}</b>). Total reservations <b>${fmtSigned(bVar)}</b>${otDelta ? `; OT Network ${otDelta > 0 ? '+' : ''}${otDelta.toLocaleString()}` : ''} — phone mix shifted to AI, not lost.`;
  } else if (bVar != null && bVar >= 0) {
    const pctAi = ((ai26 / phoneLoss) * 100).toFixed(0);
    shiftTxt = `Phone/In-House dropped <b>${phoneLoss.toLocaleString()}</b>; AI recovered <b>${ai26.toLocaleString()}</b> (${pctAi}%). Remainder went to other channels (OT ${otDelta >= 0 ? '+' : ''}${otDelta.toLocaleString()}, web/walk-in ${otherDelta >= 0 ? '+' : ''}${otherDelta.toLocaleString()}). <b>Not losing reservations overall</b> (${fmtSigned(bVar)}).`;
  } else {
    shiftTxt = `Phone/In-House dropped <b>${phoneLoss.toLocaleString()}</b>; AI recovered only <b>${ai26.toLocaleString()}</b>. OT ${otDelta >= 0 ? '+' : ''}${otDelta.toLocaleString()}, web/walk-in ${otherDelta >= 0 ? '+' : ''}${otherDelta.toLocaleString()}. Total reservations <b>${fmtSigned(bVar)}</b> — some phone volume looks <b>lost, not fully transferred</b>.`;
  }
  return { line1: `${callsTxt}. ${convTxt}.`, line2: shiftTxt };
}

function yoyVerdictBanner(r26, r25) {
  const v = buildYoyVerdict(r26, r25);
  return `<div class="insight-banner verdict"><div class="insight-mark">◆</div><div>
    <div class="insight-label">YoY Verdict — W${F.wkFrom}–W${F.wkTo}</div>
    <div class="insight-text">${v.line1}</div>
    <div class="insight-text">${v.line2}</div>
  </div></div>`;
}

/** Legacy single-paragraph insight (By Restaurant / Reservations tabs) */
function buildOverviewInsight(r26, r25) {
  const v = buildYoyVerdict(r26, r25);
  return `${v.line1} ${v.line2}`;
}

function channelShiftSources() {
  return [
    { key: 'bookingsPhoneHuman', label: 'Phone/In-House', color: '#22d98e' },
    { key: 'bookingsPhoneAI', label: 'Phone/AI', color: '#b06ef5' },
  ];
}

function linearTrend(values) {
  const n = values.length;
  if (n < 2) return values.slice();
  let sx = 0, sy = 0, sxy = 0, sx2 = 0;
  for (let i = 0; i < n; i++) {
    const y = values[i] ?? 0;
    sx += i; sy += y; sxy += i * y; sx2 += i * i;
  }
  const den = n * sx2 - sx * sx;
  const slope = den ? (n * sxy - sx * sy) / den : 0;
  const intercept = (sy - slope * sx) / n;
  return values.map((_, i) => intercept + slope * i);
}

function avgOf(arr) {
  const v = arr.filter(x => x != null && !isNaN(x));
  if (!v.length) return null;
  return v.reduce((a, b) => a + b, 0) / v.length;
}

/** Weekly phone net YoY = (In-House 2026 + AI 2026) − In-House 2025 */
function weeklyPhoneNetYoY(weeks, r26, r25) {
  const ih25 = aggByWeek(r25, 'bookingsPhoneHuman');
  const ih26 = aggByWeek(r26, 'bookingsPhoneHuman');
  const ai26 = aggByWeek(r26, 'bookingsPhoneAI');
  return weeks.map(w => (ih26[w] || 0) + (ai26[w] || 0) - (ih25[w] || 0));
}

function phoneShiftCorrelationInsight(weeks, net, rest) {
  if (!rest || !weeks.length) return '';
  const go = rest.goLive;
  const before = [], after = [];
  weeks.forEach((w, i) => {
    if (w < go) before.push(net[i]);
    else after.push(net[i]);
  });
  const aB = avgOf(before), aA = avgOf(after);
  const trend = linearTrend(net);
  const slope = trend.length >= 2 ? (trend[trend.length - 1] - trend[0]) / (trend.length - 1) : 0;
  const slopeTxt = slope >= 0
    ? `weekly net phone trend is <b>improving</b> (~${slope >= 0 ? '+' : ''}${slope.toFixed(1)} books/week)`
    : `weekly net phone trend is <b>worsening</b> (~${slope.toFixed(1)} books/week)`;
  let compare = '';
  if (aB != null && aA != null) {
    const delta = aA - aB;
    if (delta >= 0) {
      compare = `After AI Live (W${go}+), avg weekly net phone YoY is <b>${fmtSigned(aA, '')}</b> vs <b>${fmtSigned(aB, '')}</b> before — <b>less phone loss / more recovery</b> post-AI (${fmtSigned(delta, '')} pts).`;
    } else {
      compare = `After AI Live (W${go}+), avg weekly net phone YoY is <b>${fmtSigned(aA, '')}</b> vs <b>${fmtSigned(aB, '')}</b> before — <b>losing more vs PY</b> than pre-AI (${fmtSigned(delta, '')} pts).`;
    }
  }
  return `<div class="insight-banner" style="margin-top:10px"><div class="insight-mark">◆</div><div>
    <div class="insight-label">Phone loss correlation — before vs after AI</div>
    <div class="insight-text">${compare || 'Need weeks on both sides of AI Live to compare.'} Overall, ${slopeTxt}.</div>
  </div></div>`;
}

/** Split location rows into before / after AI Live (within current week filter). */
function splitPrePostAi(rows, rest) {
  const go = rest.goLive;
  const from = F.wkFrom, to = F.wkTo;
  return {
    before: (rows || []).filter(r => r.week >= from && r.week < go && r.week <= to),
    after: (rows || []).filter(r => r.week >= go && r.week >= from && r.week <= to),
    go,
    beforeLabel: from < go ? `Before AI · W${from}–W${Math.min(go - 1, to)}` : 'Before AI · (none in range)',
    afterLabel: to >= go ? `After AI · W${Math.max(go, from)}–W${to}` : 'After AI · (none in range)',
  };
}

function phoneImpactMetrics(r26, r25) {
  const ih26 = sum(r26, 'bookingsPhoneHuman');
  const ih25 = sum(r25, 'bookingsPhoneHuman');
  const ai26 = sum(r26, 'bookingsPhoneAI');

function buildChannelShiftTableHtml(r26, r25) {
  const src = channelShiftSources();
  const ph25 = sum(r25, 'bookingsPhoneHuman');
  const ph26 = sum(r26, 'bookingsPhoneHuman');
  const ai26 = sum(r26, 'bookingsPhoneAI');
  const phoneLoss = Math.max(0, ph25 - ph26);
  const rows = src.map(s => {
    const a = sum(r25, s.key), b = sum(r26, s.key);
    const d = b - a;
    let absorb = '—';
    if (phoneLoss > 0 && s.key === 'bookingsPhoneAI' && d > 0) {
      absorb = `<span class="shift-absorbed">${Math.min(100, (d / phoneLoss) * 100).toFixed(0)}% of phone loss</span>`;
    } else if (s.key === 'bookingsPhoneHuman' && d < 0) {
      absorb = `<span class="shift-leak">${Math.abs(d).toLocaleString()} lost vs 2025</span>`;
    } else if (s.key === 'bookingsPhoneHuman' && d >= 0) {
      absorb = `<span class="shift-absorbed">Not down vs 2025</span>`;
    }
    return `<tr>
      <td><span style="color:${s.color}">●</span> ${s.label}</td>
      <td>${a.toLocaleString()}</td><td>${b.toLocaleString()}</td>
      ${varPctCell(b, a).replace('</td>', ` (${d >= 0 ? '+' : ''}${d.toLocaleString()})</td>`)}
      <td>${absorb}</td>
    </tr>`;
  }).join('');
  const phone25 = ph25;
  const phone26 = ph26 + ai26;
  const net = phone26 - phone25;
  const netRead = net >= 0
    ? `<span class="shift-absorbed">Net OK — phone books not down (${net >= 0 ? '+' : ''}${net.toLocaleString()})</span>`
    : `<span class="shift-leak">Net phone leak ${net.toLocaleString()} vs 2025</span>`;
  return `<table>
    <thead><tr>
      <th>Source</th><th>2025</th><th>2026</th><th>YoY</th><th>Transfer read</th>
    </tr></thead>
    <tbody>${rows}
      <tr class="total-row">

        <td>${phone25.toLocaleString()}</td><td>${phone26.toLocaleString()}</td>
        ${varPctCell(phone26, phone25).replace('</td>', ` (${net >= 0 ? '+' : ''}${net.toLocaleString()})</td>`)}
        <td>${netRead}</td>

    </tbody>
  </table>

}

/** One-sentence location insight (uses go-live for post-AI view when available) */
function buildRestInsight(rest, r26, r25) {
  const post26 = r26.filter(r => r.isPostAI);
  const postWeeks = new Set(post26.map(r => r.week));
  const post25 = r25.filter(r => postWeeks.has(r.week));
  const scope26 = post26.length ? post26 : r26;
  const scope25 = post26.length ? post25 : r25;
  const label = post26.length ? `Since AI live (W${rest.goLive}+)` : `W${F.wkFrom}–W${F.wkTo}`;

  const b26 = sum(scope26,'bookingsTotal'), b25 = sum(scope25,'bookingsTotal');
  const bVar = signedPct(b26, b25);
  const phone26 = sum(scope26,'bookingsPhoneHuman') + sum(scope26,'bookingsPhoneAI');
  const phone25 = sum(scope25,'bookingsPhoneHuman');
  const phoneVar = signedPct(phone26, phone25);
  const bAI = sum(scope26,'bookingsPhoneAI');
  const a26 = abnRate(scope26), a25 = abnRate(scope25);
  const abnDelta = (a25 != null && a26 != null) ? (a25 - a26) : null;
  const transfer = hostieTransferRateAgg(scope26);
  const aiConv = aiConvRateAgg(scope26);
  const bookDir = bVar == null ? 'unclear (limited 2025 baseline)' : bVar >= 0 ? 'up' : 'down';
  const abnText = abnDelta == null ? '' :
    (abnDelta >= 0
      ? `abandoned improved ${abnDelta.toFixed(1)}pp`
      : `abandoned worsened ${Math.abs(abnDelta).toFixed(1)}pp`);
  return `${label}: <b>${rest.label}</b> total reservations are <b>${fmtSigned(bVar)}</b> vs same weeks in 2025; phone bookings <b>${fmtSigned(phoneVar)}</b> YoY with <b>${bAI.toLocaleString()}</b> Phone/AI books (AI conv <b>${aiConv.toFixed(1)}%</b>). ` +
    `Hostie transfer rate is <b>${fmtHostiePct(transfer)}</b>${abnText ? `; ${abnText}` : ''}. Net view: reservations are <b>${bookDir}</b> vs last year in the AI window — pair this with OT Network mix below to see if AI is the driver or a substitute for human phone.`;
}

// Period slices for summary tables (Last Week, MTD ~4 wks, YTD)
function periodRows(rows, period) {
  const lw = D.lastWeek, cutoff = D.cutoff;
  if (period === 'lw') return rows.filter(r => r.week === lw);
  if (period === 'mtd') return rows.filter(r => r.week > cutoff - 4 && r.week <= cutoff);
  return rows; // ytd (already filtered W1–cutoff)
}

function abnRate(rows) {
  const t = sum(rows,'callsTotal'), a = sum(rows,'callsAbandoned');
  return t > 0 ? a/t*100 : null;
}
function abnRateFmt(rows) {
  const v = abnRate(rows);
  return v != null ? v.toFixed(1)+'%' : '—';
}

// Heat coloring: green = good, red = bad
function heatConv(v) {
  if (v == null || isNaN(v)) return '<span class="heat-na">—</span>';
  const c = clampConvPct(v);
  const cls = c >= 42 ? 'heat-good' : c >= 32 ? 'heat-mid' : 'heat-bad';
  return `<span class="heat ${cls}">${c.toFixed(1)}%</span>`;
}
function heatAbn(v) {
  if (v == null || isNaN(v)) return '<span class="heat-na">—</span>';
  const cls = v <= 15 ? 'heat-good' : v <= 28 ? 'heat-mid' : 'heat-bad';
  return `<span class="heat ${cls}">${v.toFixed(1)}%</span>`;
}
function heatYoY(cur, prior, higherIsBetter) {
  if (cur == null || prior == null || isNaN(cur) || isNaN(prior)) return heatConv(cur);
  const c = clampConvPct(cur), p = clampConvPct(prior);
  const better = higherIsBetter ? c >= p : c <= p;
  const cls = better ? 'heat-good' : 'heat-bad';
  const arrow = c > p ? '▲' : c < p ? '▼' : '—';
  return `<span class="heat ${cls}">${c.toFixed(1)}% <span style="font-size:9px;opacity:.8">${arrow}</span></span>`;
}

    { key:'lw', label:`Last Week (W${D.lastWeek})` },
    { key:'mtd', label:'MTD (last 4 wks)' },
    { key:'ytd', label:`YTD (W${ANALYSIS_START_WEEK}–W${D.cutoff})` },
  ];
  const rows = periods.map(p => {
    const s26 = periodRows(r26, p.key), s25 = periodRows(r25, p.key);
    const p25 = sum(s25,'bookingsPhoneHuman');
    const p26 = sum(s26,'bookingsPhoneHuman') + sum(s26,'bookingsPhoneAI');
    const delta = p25 > 0 ? ((p26-p25)/p25*100) : 0;
    const cls = delta >= 0 ? 'heat-good' : 'heat-bad';
    return `<tr>
      <td class="period-label">${p.label}</td>
      <td>${p25.toLocaleString()}</td>
      <td><span class="heat ${cls}">${p26.toLocaleString()}</span></td>
      <td style="color:var(--ai)">${sum(s26,'bookingsPhoneAI').toLocaleString()}</td>
    </tr>`;
  }).join('');
  return `<div class="period-summary">
    <table>
      <thead><tr>
        <th></th><th>Phone Books 2025</th><th>Total Phone 2026</th><th>via AI 2026</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function sum(rows, field) { return rows.reduce((s,r) => s + (r[field]||0), 0); }

function pct(num, den) { return den > 0 ? (num/den*100).toFixed(1)+'%' : '—'; }

/** Conversion % — true rate (may exceed 100% when OT phone books > TalkDesk human calls). */
function convPctValue(num, den) {
  if (!(den > 0)) return null;
  return convPctRaw((num / den) * 100);
}
function fmtConvPct(v) {
  if (v == null || isNaN(v)) return '—';
  const n = convPctRaw(v);
  const txt = n.toFixed(1) + '%';
  if (n > 100) {
    return `<span class="conv-over" title="OT Phone/In-House bookings exceed TalkDesk human-answered calls (attribution mismatch). True rate shown.">${txt}†</span>`;
  }
  return txt;
}
function pctConv(num, den) {
  return fmtConvPct(convPctValue(num, den));
}
const CONV_FOOTNOTE = `<div class="conv-footnote">Conv % uses TalkDesk answered calls as the denominator and OpenTable phone bookings as the numerator. When OT Phone/In-House &gt; TalkDesk human calls (e.g. Claudie W21: 148 books ÷ 136 human calls = 108.8%†), Human Conv can exceed 100% — that is attribution mismatch, not a formula error. Prefer <b>Total Conv %</b> = (Phone IH + Phone AI) ÷ (Human + AI calls) for an apples-to-apples phone conversion.</div>`;

function fmt(n) { return n == null ? '—' : n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n); }

function yoyBadge(v26, v25) {
  if (!v25) return '';
  const d = (v26-v25)/v25*100;
  const cls = d > 0 ? 'badge-up' : d < 0 ? 'badge-dn' : 'badge-neu';
  const sign = d > 0 ? '▲' : '▼';
  return `<span class="kpi-badge ${cls}">${sign}${Math.abs(d).toFixed(1)}%</span>`;
}

function mergeChartOptions(base, extra) {
  const out = { ...base, ...extra };
  if (base.scales || extra.scales) {
    out.scales = { ...(base.scales || {}) };
    for (const key of Object.keys(extra.scales || {})) {
      out.scales[key] = { ...(base.scales?.[key] || {}), ...extra.scales[key] };
    }
  }
  if (base.plugins || extra.plugins) {
    out.plugins = { ...base.plugins, ...extra.plugins };
    if (base.plugins?.annotation || extra.plugins?.annotation) {
      out.plugins.annotation = { ...(base.plugins?.annotation || {}), ...(extra.plugins?.annotation || {}) };
    }
  }
  return out;
}

// YoY variance bars may be negative — let Chart.js auto-scale
const Y_AUTO = { scales: { y: { min: undefined } } };

function mkChart(id, type, data, options={}, extraPlugins=[]) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  if (CHARTS[id]) { CHARTS[id].destroy(); delete CHARTS[id]; }
  const defaults = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      datalabels: { display: false },
      tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y?.toLocaleString() ?? ctx.parsed}` } },
    },
    scales: {
      x: { grid: { color: 'rgba(42,48,80,.5)' }, ticks: { color: '#7b82a6', maxRotation: 0 } },
      y: { min: 0, grid: { color: 'rgba(42,48,80,.5)' }, ticks: { color: '#7b82a6' } },
    },
  };
  CHARTS[id] = new Chart(canvas, {
    type,
    data,
    options: mergeChartOptions(defaults, options),
    plugins: extraPlugins,
  });
  return CHARTS[id];
}

function weekLabels(rows) {
  const wks = [...new Set(rows.map(r=>r.week))].sort((a,b)=>a-b);
  return wks.map(w => 'W'+w);
}

function aggByWeek(rows, field) {
  const map = {};
  rows.forEach(r => { map[r.week] = (map[r.week]||0) + (r[field]||0); });
  return map;
}

function getWeeks() {
  const wks = new Set();
  (D.rows26||[]).forEach(r => { if(r.week>=F.wkFrom && r.week<=F.wkTo) wks.add(r.week); });
  (D.rows25||[]).forEach(r => { if(r.week>=F.wkFrom && r.week<=F.wkTo) wks.add(r.week); });
  return [...wks].sort((a,b)=>a-b);
}

function annoGoLive(goLiveWeek, weeks) {
  const idx = weeks.indexOf(goLiveWeek);
  if (idx < 0) return {};
  return { 'go-live': { type:'line', xMin:idx, xMax:idx, borderColor:'rgba(167,139,250,.8)', borderWidth:2, borderDash:[4,3],
    label:{ content:'AI Live', display:true, color:'#a78bfa', font:{size:10}, position:'start' }}};
}

  const rows = rests.map(rest => {

    totAfterPhone += m.after.phone26;
    totBeforeCalls25 += m.before.calls25;
    totAfterCalls25 += m.after.calls25;

      label: rest.label,
      color: rest.color,
      goLive: rest.goLive,
      before: m.before,
      after: m.after,
      isTotal: false,

  rows.push({
    label: 'All locations',
    color: '#eef0fb',
    goLive: null,
    before: {
      calls: totBeforeCalls,

      phone26: totAfterPhone,
      phoneYoY: signedPct(totAfterPhone, totAfterPhone25),

  });
  return rows;
}

function overviewAiImpactMetrics(rest) {
  const savedFrom = F.wkFrom, savedTo = F.wkTo;
  F.wkFrom = ANALYSIS_START_WEEK;
  F.wkTo = D.cutoff;
  const r26 = (D.rows26 || []).filter(r => r.restaurantId === rest.id && r.week >= ANALYSIS_START_WEEK && r.week <= D.cutoff);
  const r25 = (D.rows25 || []).filter(r => r.restaurantId === rest.id && r.week >= ANALYSIS_START_WEEK && r.week <= D.cutoff);
  const s26 = splitPrePostAi(r26, rest);
  const s25 = splitPrePostAi(r25, rest);
  F.wkFrom = savedFrom;
  F.wkTo = savedTo;

  const pack = (rows26, rows25) => {
    const ih26 = sum(rows26, 'bookingsPhoneHuman');
    const ai26 = sum(rows26, 'bookingsPhoneAI');
    const phone26 = ih26 + ai26;
    const phone25 = sum(rows25, 'bookingsPhoneHuman');
    return {
      ih26, ai26, phone26, phone25,
      phoneYoY: signedPct(phone26, phone25),
      calls: sum(rows26, 'callsTotal'),
      callsYoY: signedPct(sum(rows26, 'callsTotal'), sum(rows25, 'callsTotal')),
      books: sum(rows26, 'bookingsTotal'),
      booksYoY: signedPct(sum(rows26, 'bookingsTotal'), sum(rows25, 'bookingsTotal')),
      calls25: sum(rows25, 'callsTotal'),
      books25: sum(rows25, 'bookingsTotal'),
    };
  };
  return {
    go: rest.goLive,
    before: pack(s26.before, s25.before),
    after: pack(s26.after, s25.after),
  };
}

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[data-pdf-lib="${src}"]`) || document.querySelector(`script[src="${src}"]`);
    if (existing) {
      if (existing.dataset.loaded === '1') return resolve();
      existing.addEventListener('load', () => resolve(), { once: true });
      existing.addEventListener('error', () => reject(new Error('Failed to load ' + src)), { once: true });
      return;
    }
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.dataset.pdfLib = src;
    s.onload = () => { s.dataset.loaded = '1'; resolve(); };
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}

function resolveJsPdfCtor() {
  return window.jspdf?.jsPDF || window.jsPDF || window.jspdf?.default?.jsPDF || null;
}

async function ensurePdfLibs() {
  let JsPDF = resolveJsPdfCtor();
  if (typeof JsPDF === 'function') return { JsPDF };

  const cdns = [
    'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
    'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js',
  ];
  let lastErr = null;
  for (const src of cdns) {
    try {
      await loadScriptOnce(src);
      JsPDF = resolveJsPdfCtor();
      if (typeof JsPDF === 'function') return { JsPDF };
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('PDF libraries unavailable');
}

function hexToRgb(hex) {
  const h = String(hex || '#eef0fb').replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}

function pdfPlainConv(v) {
  if (v == null || isNaN(v)) return '—';
  return convPctRaw(v).toFixed(1) + '%';
}

function pdfPlainSigned(v) {
  if (v == null || isNaN(v)) return '—';
  const sign = v > 0 ? '+' : '';
  return `${sign}${v.toFixed(1)}%`;
}

function pdfWrapText(pdf, text, x, y, maxW, lineH) {
  const lines = pdf.splitTextToSize(String(text || ''), maxW);
  pdf.text(lines, x, y);
  return y + lines.length * lineH;
}

/** Title + hairline rule spanning the rest of the content width. */
function pdfTitleRule(pdf, text, x, y, contentW, opts = {}) {
  const size = opts.size || 14;
  const color = opts.color || [238, 240, 251];
  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(size);
  pdf.setTextColor(...color);
  pdf.text(text, x, y);
  const tw = pdf.getTextWidth(text);
  const ruleX = x + tw + 3;
  const ruleEnd = x + contentW;
  if (ruleEnd > ruleX + 4) {
    pdf.setDrawColor(37, 45, 74);
    pdf.setLineWidth(0.35);
    pdf.line(ruleX, y - size * 0.18, ruleEnd, y - size * 0.18);
  }
  return y + (opts.after || 5);
}

/** Center main + sub as a pair inside a cell; never spill past cell bounds. */
function pdfMetricPair(pdf, cellX, cellW, y, main, sub, subRgb) {
  const pad = 1.2;
  const gap = 1.3;
  const usable = Math.max(4, cellW - pad * 2);

  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(7.5);
  let mainStr = String(main);
  let mainW = pdf.getTextWidth(mainStr);

  pdf.setFont('helvetica', 'normal');
  pdf.setFontSize(5.8);
  let subStr = String(sub);
  let subW = pdf.getTextWidth(subStr);

  // Shrink sub first if the pair is too wide
  if (mainW + gap + subW > usable) {
    pdf.setFontSize(5.5);
    subW = pdf.getTextWidth(subStr);
  }
  if (mainW + gap + subW > usable) {
    const maxSub = Math.max(0, usable - mainW - gap);
    while (subStr.length > 2 && pdf.getTextWidth(subStr) > maxSub) {
      subStr = subStr.slice(0, -1);
    }
    if (subStr !== String(sub)) subStr = subStr.trimEnd() + '…';
    subW = pdf.getTextWidth(subStr);
  }

  const total = mainW + gap + subW;
  let start = cellX + pad + (usable - total) / 2;
  if (start < cellX + pad) start = cellX + pad;

  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(7.5);
  pdf.setTextColor(238, 240, 251);
  pdf.text(mainStr, start, y);

  pdf.setFont('helvetica', 'normal');
  pdf.setFontSize(5.8);
  pdf.setTextColor(...(subRgb || [136, 144, 184]));
  pdf.text(subStr, start + mainW + gap, y);
}

function collectOverviewScorecardRows() {
  const mtdFrom = Math.max(ANALYSIS_START_WEEK, D.cutoff - 3);
  const rests = (F.location && F.location !== 'all')
    ? RESTS.filter(r => r.id === F.location)
    : RESTS;
  const periods = ['lw', 'mtd', 'ytd'];
  const rows = rests.map(rest => ({
    label: rest.label,
    color: rest.color,
    metrics: periods.map(p => overviewPeriodMetrics(rest.id, p)),
  }));
  const ids = new Set(rests.map(r => r.id));
  const allMetrics = periods.map(p => {
    const r26 = locSummaryScope(D.rows26, p).filter(r => ids.has(r.restaurantId));
    const r25 = locSummaryScope(D.rows25, p).filter(r => ids.has(r.restaurantId));
    return {
      calls: sum(r26, 'callsTotal'),
      callsYoY: signedPct(sum(r26, 'callsTotal'), sum(r25, 'callsTotal')),
      phoneBooked: phoneBooks(r26),
      phoneBookedYoY: signedPct(phoneBooks(r26), phoneBooks(r25)),
      transfer: hostieTransferRateAgg(r26),
      humanConv: humanConvRateAgg(r26),
      humanConv25: humanConvRateAgg(r25),
      aiConv: sum(r26, 'callsAI') > 0 ? aiConvRateAgg(r26) : null,
      aiConv25: sum(r25, 'callsAI') > 0 ? aiConvRateAgg(r25) : null,
    };
  });
  rows.push({ label: 'All', color: '#eef0fb', metrics: allMetrics, isTotal: true });
  return { rows, mtdFrom, periods };
}

function paintOverviewAiImpactChart() {
  const rests = (F.location && F.location !== 'all')
    ? RESTS.filter(r => r.id === F.location)
    : RESTS;

  const labels = [];
  const locAtIndex = [];
  const phaseAtIndex = [];
  rests.forEach((rest, ri) => {
    if (ri > 0) {
      labels.push('');
      locAtIndex.push(null);
      phaseAtIndex.push(null);
    }
    labels.push('Before AI');
    locAtIndex.push(rest);
    phaseAtIndex.push('before');
    labels.push('After AI');
    locAtIndex.push(rest);
    phaseAtIndex.push('after');
  });

  const phone25 = [], ih26 = [], ai26 = [], phoneYoY = [], phoneTot26 = [];
  locAtIndex.forEach((rest, i) => {
    if (!rest) {
      phone25.push(null); ih26.push(null); ai26.push(null);
      phoneYoY.push(null); phoneTot26.push(null);
      return;
    }
    const m = overviewAiImpactMetrics(rest);
    const side = phaseAtIndex[i] === 'before' ? m.before : m.after;
    phone25.push(side.phone25);
    ih26.push(side.ih26);
    ai26.push(side.ai26);
    phoneYoY.push(side.phoneYoY);
    phoneTot26.push(side.phone26);
  });

  // Total label on top of 2026 stack only (AI segment); IH segment unlabeled to avoid clutter
  const stackTotalLabels = {
    display: ctx => ctx.dataset.label === '2026 Phone/AI' && (phoneTot26[ctx.dataIndex] || 0) > 0,
    anchor: 'end',
    align: 'top',
    offset: 2,
    clamp: true,
    font: { size: 9, weight: '700' },
    color: ctx => {
      const y = phoneYoY[ctx.dataIndex];
      if (y == null) return '#c8cde0';
      return y >= 0 ? '#22d98e' : '#ff5c6a';
    },
    formatter: (_v, ctx) => {
      const tot = phoneTot26[ctx.dataIndex];
      const y = phoneYoY[ctx.dataIndex];

  const booksVar   = RESTS.map(r => varPct('bookingsTotal','bookingsTotal',r.id));

function varPctCell(cur, prior) {
  if (!(prior > 0)) return '<td class="neu">—</td>';
  const v = ((cur - prior) / prior) * 100;
  const cls = v >= 0 ? 'up' : 'dn';
  const sign = v > 0 ? '+' : '';
  return `<td class="${cls}">${sign}${v.toFixed(1)}%</td>`;
}
function convYoYCell(cur, prior) {
  if (cur == null || isNaN(cur)) return '<td>—</td>';
  const c = clampConvPct(cur);
  const p = prior == null || isNaN(prior) ? null : clampConvPct(prior);
  const body = `${c.toFixed(1)}%`;
  if (p == null || (!(p > 0) && p !== 0)) {
    return `<td>${body}</td>`;
  }
  const better = c >= p;
  return `<td class="${better ? 'up' : 'dn'}">${body}</td>`;
}
function phoneBooks(rows) {
  return sum(rows, 'bookingsPhoneHuman') + sum(rows, 'bookingsPhoneAI');
}
function locSummaryScope(rowsAll, period) {
  const cutoff = D.cutoff;
  let rows = rowsAll || [];
  if (F.location && F.location !== 'all') {
    rows = rows.filter(r => r.restaurantId === F.location);
  }
  if (period === 'lw' || period === 'lastweek') {
    return rows.filter(r => r.week === cutoff);
  }
  if (period === 'mtd') {
    const from = Math.max(ANALYSIS_START_WEEK, cutoff - 3);
    return rows.filter(r => r.week >= from && r.week <= cutoff);
  }
  return rows.filter(r => r.week >= ANALYSIS_START_WEEK && r.week <= cutoff);
}
function locSummaryRowHtml(labelHtml, r26, r25, isTotal) {
  const c26 = sum(r26, 'callsTotal'), c25 = sum(r25, 'callsTotal');
  const b26 = sum(r26, 'bookingsTotal'), b25 = sum(r25, 'bookingsTotal');
  const p26 = phoneBooks(r26), p25 = phoneBooks(r25);
  const h26 = humanConvRateAgg(r26), h25 = humanConvRateAgg(r25);
  const a26 = aiConvRateAgg(r26), a25 = aiConvRateAgg(r25);
  const h25Html = sum(r25, 'callsHuman') > 0 ? fmtConvPct(h25) : '—';
  const ai26Html = sum(r26, 'callsAI') > 0 ? fmtConvPct(a26) : '—';
  const ai25Html = sum(r25, 'callsAI') > 0 ? fmtConvPct(a25) : '—';
  return `<tr class="${isTotal ? 'total-row' : ''}">
    <td>${labelHtml}</td>
    <td>${c26.toLocaleString()}</td><td>${c25.toLocaleString()}</td>${varPctCell(c26, c25)}
    <td>${b26.toLocaleString()}</td><td>${b25.toLocaleString()}</td>${varPctCell(b26, b25)}
    <td>${p26.toLocaleString()}</td><td>${p25.toLocaleString()}</td>${varPctCell(p26, p25)}
    ${convYoYCell(h26, h25)}<td>${h25Html}</td>
    <td style="color:var(--ai)">${ai26Html}</td><td>${ai25Html}</td>
  </tr>`;
}

function buildLocSummaryTable(tbodyId, period) {
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  const rests = (F.location && F.location !== 'all')
    ? RESTS.filter(r => r.id === F.location)
    : RESTS;
  const rows = rests.map(rest => {
    const r26 = locSummaryScope(D.rows26, period).filter(r => r.restaurantId === rest.id);
    const r25 = locSummaryScope(D.rows25, period).filter(r => r.restaurantId === rest.id);
    return locSummaryRowHtml(
      `<span style="color:${rest.color}">●</span> ${rest.label}`,
      r26, r25, false
    );
  });
  const all26 = locSummaryScope(D.rows26, period).filter(r => rests.some(x => x.id === r.restaurantId));
  const all25 = locSummaryScope(D.rows25, period).filter(r => rests.some(x => x.id === r.restaurantId));
  rows.push(locSummaryRowHtml('Total', all26, all25, true));
  tbody.innerHTML = rows.join('');
  const card = tbody.closest('.table-card');
  if (card && !card.querySelector('.conv-footnote')) {
    card.insertAdjacentHTML('beforeend', CONV_FOOTNOTE);
  }
}

    b.onclick = () => { activeRest = r.id; renderByRest(); };
    btns.appendChild(b);
  });

  renderRestDetail(activeRest);
}

function goLiveAnno(rest, weeks) {
  return annoGoLive(rest.goLive, weeks);
}

function buildRcCalls(id, rest, weeks, r26, r25) {
  const m26=aggByWeek(r26,'callsTotal'), m25=aggByWeek(r25,'callsTotal');
  mkChart(`rc-calls-${id}`,'line',{
    labels:weeks.map(w=>'W'+w),
    datasets:[
      {label:'2025',data:weeks.map(w=>m25[w]||0),borderColor:'#ff9f2e',backgroundColor:'rgba(255,159,46,.10)',tension:.3,fill:true,borderWidth:2.5,pointRadius:0,pointHoverRadius:4},
      {label:'2026',data:weeks.map(w=>m26[w]||0),borderColor:rest.color,backgroundColor:rest.color+'18',tension:.3,fill:true,borderWidth:2.5,pointRadius:0,pointHoverRadius:4},
    ]
  },{plugins:{annotation:{annotations:goLiveAnno(rest,weeks)}}});
}

function buildRcAbn(id, rest, weeks, r26, r25) {
  const rate = (rs, w) => { const t=aggByWeek(rs,'callsTotal')[w]||0, a=aggByWeek(rs,'callsAbandoned')[w]||0; return t>0?a/t*100:null; };
  mkChart(`rc-abn-${id}`,'line',{
    labels:weeks.map(w=>'W'+w),
    datasets:[
      {label:'2025 Abn%',data:weeks.map(w=>rate(r25,w)),borderColor:'#ff9f2e',tension:.3,fill:false,borderWidth:2.5,spanGaps:true,pointRadius:0,pointHoverRadius:4},
      {label:'2026 Abn%',data:weeks.map(w=>rate(r26,w)),borderColor:rest.color,tension:.3,fill:false,borderWidth:2.5,spanGaps:true,pointRadius:0,pointHoverRadius:4},
    ]
  },{scales:{y:{ticks:{callback:v=>v?.toFixed(1)+'%'}}},plugins:{annotation:{annotations:goLiveAnno(rest,weeks)}}});
}

  const conv26ai = w => { const r=r26.find(x=>x.week===w); return aiConvRate(r); };
  const conv26tot = w => { const r=r26.find(x=>x.week===w); return totalConvRate(r); };
  const conv25 = w => { const r=r25.find(x=>x.week===w); return humanConvRate(r); };
  mkChart(`rc-conv-${id}`,'line',{
    labels:weeks.map(w=>'W'+w),
    datasets:[
      {label:'2025 Human',data:weeks.map(conv25),borderColor:'#ff9f2e',tension:.3,fill:false,borderWidth:2.5,spanGaps:true,pointRadius:0,pointHoverRadius:4},

/** Latest YTD weeks through cutoff (ignores week filter — always current data). */
function callCenterLatestRows() {
  const to = D.cutoff;
  const from = ANALYSIS_START_WEEK;
  let r26 = (D.rows26 || []).filter(r => r.week >= from && r.week <= to);
  let r25 = (D.rows25 || []).filter(r => r.week >= from && r.week <= to);
  if (F.location && F.location !== 'all') {
    r26 = r26.filter(r => r.restaurantId === F.location);
    r25 = r25.filter(r => r.restaurantId === F.location);
  }
  const weeks = [];
  for (let w = from; w <= to; w++) weeks.push(w);
  return { r26, r25, weeks, from, to };
}

function buildCcHumanTrendTableHtml(r26, r25, weeks, to) {
  const sumHuman = (rows, weekList) => {
    const set = new Set(weekList);
    return sum(rows.filter(r => set.has(r.week)), 'callsHuman');
  };
  const windows = [
    { key: 'lw', label: 'Last week', sub: `W${to}`, weeks: weeks.filter(w => w === to) },
    { key: 'w4', label: 'Last 4 weeks', sub: `W${Math.max(weeks[0], to - 3)}–W${to}`, weeks: weeks.filter(w => w >= to - 3 && w <= to) },
    { key: 'w10', label: 'Last 10 weeks', sub: `W${Math.max(weeks[0], to - 9)}–W${to}`, weeks: weeks.filter(w => w >= to - 9 && w <= to) },
  ];

  const body = windows.map(win => {
    const v26 = sumHuman(r26, win.weeks);
    const v25 = sumHuman(r25, win.weeks);
    const yoy = signedPct(v26, v25);
    const abs = v26 - v25;
    const absTxt = abs > 0 ? `+${abs.toLocaleString()}` : abs.toLocaleString();
    const yoyCls = yoy == null ? '' : (yoy >= 0 ? 'up' : 'dn');
    const yoyTxt = yoy == null ? '—' : fmtSigned(yoy);
    return `<tr>
      <td style="text-align:left"><b>${win.label}</b>
        <div style="font-size:10px;color:var(--muted);font-weight:500">${win.sub}</div></td>
      <td><b style="color:#f59e0b">${v25.toLocaleString()}</b></td>
      <td><b style="color:#34d399">${v26.toLocaleString()}</b></td>
      <td><b class="${yoyCls}">${yoyTxt}</b>
        <span style="font-size:11px;color:var(--muted);margin-left:4px">${yoy == null ? '' : absTxt}</span></td>
    </tr>`;
  }).join('');

  return `<div class="ov-ai-impact-table" style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px">
    <table class="exec-kpi-table" style="min-width:0;width:100%">

          <th style="text-align:left">Window</th>
          <th>2025 Human</th>
          <th>2026 Human</th>
          <th>YoY Var %</th>

      </thead>
      <tbody>${body}</tbody>
    </table>
    <p class="loc-summary-note" style="margin:8px 0 0">Human = TalkDesk human-answered (excl. If-No-Answer / AI) · YoY vs the same ISO weeks in 2025 · abs change shown next to %</p>
  </div>`;
}

let _peopleStatic = null;   // cached ./people.json when no backend
let _peopleReadOnly = false; // true on GitHub Pages (no POST endpoint)

/** Resolve a static asset next to the dashboard (works with/without trailing slash). */
function staticAssetUrl(name) {
  let dir = location.pathname || '/';
  if (dir.endsWith('.html')) dir = dir.replace(/\/[^/]+$/, '/');
  else if (!dir.endsWith('/')) dir = dir + '/';
  return dir + name;
}

async function fetchJsonSafe(url) {
  const r = await fetch(url);
  const text = await r.text();
  const trimmed = (text || '').trim();
  if (!r.ok || !trimmed.startsWith('{') && !trimmed.startsWith('[')) {
    return null;
  }
  try { return JSON.parse(trimmed); } catch { return null; }
}

async function loadPeople(week) {
  const onStaticHost = /github\.io$/i.test(location.hostname) || location.protocol === 'file:';

  // Local Express API (skip on GitHub Pages — /api/* is not under the project path)
  if (!onStaticHost) {
    const j = await fetchJsonSafe(`/api/people?week=${week}`);
    if (j && j.ok) { _peopleReadOnly = false; return j; }
  }

  if (!_peopleStatic) {
    const bust = 'v=20260716b';
    _peopleStatic = await fetchJsonSafe(staticAssetUrl('people.json') + '?' + bust);
    if (!_peopleStatic) {
      _peopleStatic = await fetchJsonSafe('./people.json?' + bust);
    }
  }
  if (!_peopleStatic) {
    throw new Error('People snapshot missing. Re-export with: npm run dashboard:export');
  }
  _peopleReadOnly = true;
  const weeks = _peopleStatic.weeks || {};
  const pick = weeks[String(week)] || weeks[String(_peopleStatic.latestWeek)] || Object.values(weeks)[0];
  if (!pick) throw new Error('No people data available in snapshot');
  return pick;
}

async function renderPeople() {
  const el = document.getElementById('page-people');
  if (!el) return;
  el.innerHTML = `<div class="loading">Loading Call Center…</div>`;
  try {
    const week = D.cutoff || F.wkTo || 24;
    const j = await loadPeople(week);
    if (!j.ok) {
      el.innerHTML = `${callCenterSummaryHtml()}
        <div class="table-card"><p>${j.error || 'Agent report not available.'}</p>
        <div class="stat-note">Ensure TalkDesk CSV is in <code>data/</code> and re-export the dashboard.</div></div>`;
      requestAnimationFrame(() => paintCallCenterSummaryCharts());
      return;
    }

    const fmtPct = (v) => v == null ? '—' : `${(v * 100).toFixed(1)}%`;
    const fmtSecs = (s) => {
      if (!s) return '0s';
      if (s >= 3600) return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
      if (s >= 60) return `${Math.floor(s/60)}m ${s%60}s`;
      return `${Math.round(s * 10) / 10}s`;
    };
    const fmtNum = (n) => (n ?? 0).toLocaleString();
    const fmtCph = (v) => v == null ? '—' : v.toFixed(2);

    const periodHdr = (label, sub) =>
      `<th colspan="9" class="grp-start">${label}<div style="font-weight:400;font-size:10px;color:var(--muted)">${sub}</div></th>`;

    const ringMetricCells = (m, agentName, period, editable) => {
      const wh = m.workedHours;
      const hoursCell = (editable && !_peopleReadOnly)
        ? `<td><input class="hours-input" type="number" min="0" step="0.01" data-agent="${agentName}" data-period="${period}" value="${wh != null ? wh : ''}" placeholder="hrs" title="Edit worked hours — saves on blur"></td>`
        : `<td>${wh != null ? wh : '—'}</td>`;
      return `
        <td class="grp-start">${fmtNum(m.calls)}</td>
        <td>${fmtPct(m.pct)}</td>
        ${hoursCell}
        <td>${fmtCph(m.callsPerHour)}</td>
        <td>${fmtSecs(m.avgTalkSecs)}</td>
        <td>${fmtSecs(m.maxTalkSecs)}</td>
        <td>${fmtSecs(m.asaSecs)}</td>
        <td>${fmtNum(m.missed)}</td>
        <td>${fmtPct(m.missedPct)}</td>`;
    };

    const ringRows = (j.ringGroups.agents || []).map(a => `
      <tr class="${a.isAi ? 'ai-row' : ''}">
        <td style="text-align:left">${a.isAi ? 'AI Agent' : a.agentName}</td>
        ${ringMetricCells(a.week, a.agentName, 'week', !a.isAi)}
        ${ringMetricCells(a.mtd, a.agentName, 'mtd', !a.isAi)}
      </tr>`).join('');

    const t = j.ringGroups.totals;
    const ringTotalRow = `
      <tr style="font-weight:700">
        <td style="text-align:left">Total</td>
        ${ringMetricCells(t.week, '', 'week', false)}
        ${ringMetricCells(t.mtd, '', 'mtd', false)}
      </tr>`;

    const typeCols = (j.typeOfCall.types || []);
    const typeHdr = typeCols.map(c => `<th>${c}</th>`).join('') + '<th>% NA</th><th>Total</th>';
    const typeCells = (b) => typeCols.map(c => `<td>${fmtNum(b.types?.[c])}</td>`).join('')
      + `<td>${fmtPct(b.naPct)}</td><td>${fmtNum(b.total)}</td>`;

    const typeAgentRows = (j.typeOfCall.agents || []).map(a => `
      <tr class="${a.isAi ? 'ai-row' : ''}">
        <td style="text-align:left">${a.isAi ? 'AI Agent' : a.agentName}</td>
        ${typeCols.map(c => `<td>${fmtNum(a.week.types?.[c])}</td>`).join('')}
        <td>${fmtPct(a.week.naPct)}</td>
        <td>${fmtNum(a.week.total)}</td>

let _hoursEditMode = true; // localhost: always editable; Pages forces view-only via _peopleReadOnly

function fmtWow(v) {
  if (v == null || Number.isNaN(v)) return '—';
  const cls = v > 0 ? 'wow-up' : v < 0 ? 'wow-dn' : '';
  const sign = v > 0 ? '+' : '';
  return '<span class="' + cls + '">' + sign + Number(v).toFixed(1) + '%</span>';
}

function hoursCalFromReport(j) {
  return j && j.hoursCalendar ? j.hoursCalendar : null;
}

async function fetchHoursCalendar(week) {
  try {
    const r = await fetch('/api/people/hours-calendar?week=' + week);
    const data = await r.json();
    if (data.ok && data.calendar) return data.calendar;
  } catch (_) {}
  return null;
}

function escAttr(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function paintHoursCalendar(cal, editable) {
  const root = document.getElementById('hours-cal-root');
  if (!root) return;
  if (!cal) {
    root.innerHTML = '<p class="people-note">Hours calendar unavailable.</p>';
    return;
  }
  const weeks = cal.weeks || [];
  const agents = cal.agents || [];
  const head = weeks.map(w => '<th>' + (w.label || ('W' + w.week)) + '</th>').join('')
    + '<th>Total</th><th>WoW</th>' + (editable ? '<th></th>' : '');
  const rows = agents.map(a => {
    const cells = weeks.map(w => {
      const v = a.hours ? a.hours[w.week] : null;
      if (editable) {
        return '<td><input class="hours-cal-input" type="number" min="0" step="0.25" inputmode="decimal" data-agent="'
          + escAttr(a.agentName) + '" data-week="' + w.week
          + '" value="' + (v != null ? v : '') + '" placeholder="—" title="Hours for ' + escAttr(a.agentName) + ' · ' + (w.label || ('W' + w.week)) + '"></td>';
      }
      return '<td>' + (v != null ? v : '—') + '</td>';
    }).join('');
    const tag = a.source === 'manual' ? '<span class="manual-tag">added</span>' : '';
    const remove = editable
      ? '<td><button type="button" class="btn-remove-agent" data-agent="'
        + escAttr(a.agentName) + '" title="Remove from Staff Hours &amp; Call Center">Remove</button></td>'
      : '';
    return '<tr data-agent-row="' + escAttr(a.agentName) + '"><td class="agent-col">' + escAttr(a.agentName) + tag + '</td>' + cells
      + '<td class="row-total">' + (a.total != null ? a.total : 0) + '</td><td class="row-wow">' + fmtWow(a.wow) + '</td>' + remove + '</tr>';
  }).join('');
  const totCells = weeks.map(w => {
    const v = cal.totals && cal.totals.hours ? cal.totals.hours[w.week] : 0;
    return '<td data-week-total="' + w.week + '">' + (v != null ? v : 0) + '</td>';
  }).join('');
  const foot = '<tr><td class="agent-col">Total hours</td>' + totCells
    + '<td class="foot-total">' + ((cal.totals && cal.totals.total) || 0) + '</td><td class="foot-wow">' + fmtWow(cal.totals && cal.totals.wow) + '</td>'
    + (editable ? '<td></td>' : '') + '</tr>';
  root.innerHTML = '<div class="hours-cal-wrap"><table class="people-table hours-cal-table"><thead><tr><th class="agent-col">Agent</th>'
    + head + '</tr></thead><tbody>' + rows + '</tbody><tfoot>' + foot + '</tfoot></table></div>';
}

function applyHoursCalendarTotals(cal) {
  if (!cal) return;
  const agents = cal.agents || [];
  for (const a of agents) {
    const row = document.querySelector('tr[data-agent-row="' + CSS.escape(a.agentName) + '"]');
    if (!row) continue;
    const tot = row.querySelector('.row-total');
    const wow = row.querySelector('.row-wow');
    if (tot) tot.textContent = a.total != null ? String(a.total) : '0';
    if (wow) wow.innerHTML = fmtWow(a.wow);
  }
  for (const w of cal.weeks || []) {
    const cell = document.querySelector('[data-week-total="' + w.week + '"]');
    if (cell) cell.textContent = String((cal.totals && cal.totals.hours && cal.totals.hours[w.week]) || 0);
  }
  const ft = document.querySelector('.foot-total');
  const fw = document.querySelector('.foot-wow');
  if (ft) ft.textContent = String((cal.totals && cal.totals.total) || 0);
  if (fw) fw.innerHTML = fmtWow(cal.totals && cal.totals.wow);
}

async function renderStaffHoursPanel(j) {
  if (!j) return;
  const addRow = document.getElementById('hours-cal-add');
  const hint = document.getElementById('hours-edit-hint');
  const canEdit = !_peopleReadOnly;
  _hoursEditMode = canEdit;
  if (hint) {
    hint.textContent = !canEdit
      ? 'View-only on shared link — edit on http://localhost:3456 (Call Center → Staff Hours).'
      : 'Editable — click a cell, type hours, Tab/Enter to save. Changes update Call Center Calls/Hour.';
  }
  if (addRow) addRow.style.display = canEdit ? 'flex' : 'none';

  let cal = hoursCalFromReport(j);
  if (!cal) cal = await fetchHoursCalendar(j.selectedWeek);
  paintHoursCalendar(cal, canEdit);
  wireHoursCalEditors(j);

  const addBtn = document.getElementById('hours-add-agent');
  const nameInput = document.getElementById('hours-new-agent');
  const doAdd = async () => {
    const name = ((nameInput && nameInput.value) || '').trim();
    if (!name) { nameInput?.focus(); return; }
    const resp = await fetch('/api/people/roster', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'add', agentName: name, week: j.selectedWeek }),
    });
    const data = await resp.json();
    if (data.ok) {
      if (nameInput) nameInput.value = '';
      if (data.report) window._peopleReport = data.report;
      const hintEl = document.getElementById('hours-save-hint');
      if (hintEl) { hintEl.textContent = ' · ' + name + ' added'; setTimeout(() => { hintEl.textContent = ''; }, 2500); }
      paintHoursCalendar(data.calendar || hoursCalFromReport(data.report), true);
      wireHoursCalEditors(window._peopleReport || j);
      // Focus first empty hour cell for the new agent
      const first = document.querySelector('tr[data-agent-row="' + CSS.escape(name) + '"] .hours-cal-input');
      first?.focus();
    } else {
      alert(data.error || 'Failed to add person');
    }
  };
  if (addBtn) addBtn.onclick = doAdd;
  if (nameInput) {
    nameInput.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); doAdd(); }
    };
  }
}

function wireHoursCalEditors(j) {
  document.querySelectorAll('.hours-cal-input').forEach(input => {
    const save = async () => {
      const agentName = input.dataset.agent;
      const week = parseInt(input.dataset.week, 10);
      const hours = input.value === '' ? null : parseFloat(input.value);
      if (hours != null && (isNaN(hours) || hours < 0)) return;
      if (input.dataset.lastSaved === String(hours ?? '')) return;
      input.classList.add('saving');
      try {
        const resp = await fetch('/api/people/worked-hours', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agentName, period: 'week', year: j.year, week, hours }),
        });
        const data = await resp.json();
        if (data.ok) {
          input.dataset.lastSaved = String(hours ?? '');
          if (data.report) window._peopleReport = data.report;
          const cal = hoursCalFromReport(data.report);
          applyHoursCalendarTotals(cal);
          const hintEl = document.getElementById('hours-save-hint');
          if (hintEl) { hintEl.textContent = ' · Saved'; setTimeout(() => { hintEl.textContent = ''; }, 1800); }
          input.classList.add('saved');
          setTimeout(() => input.classList.remove('saved'), 900);
        }
      } catch (e) { console.error(e); }
      finally { input.classList.remove('saving'); }
    };
    input.onblur = save;
    input.onkeydown = (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const inputs = [...document.querySelectorAll('.hours-cal-input')];
        const idx = inputs.indexOf(input);
        save().then(() => {
          const next = inputs[idx + 1];
          if (next) next.focus();
          else input.blur();
        });
      }
    };
  });
  document.querySelectorAll('.btn-remove-agent').forEach(btn => {
    btn.onclick = async () => {
      const agentName = btn.dataset.agent;
      if (!agentName || !confirm('Remove ' + agentName + ' from Staff Hours and Call Center hours?')) return;
      const resp = await fetch('/api/people/roster', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'remove', agentName, week: j.selectedWeek }),
      });
      const data = await resp.json();
      if (data.ok) {
        if (data.report) window._peopleReport = data.report;
        paintHoursCalendar(data.calendar || hoursCalFromReport(data.report), true);
        wireHoursCalEditors(window._peopleReport || j);
        const hintEl = document.getElementById('hours-save-hint');
        if (hintEl) { hintEl.textContent = ' · Removed ' + agentName; setTimeout(() => { hintEl.textContent = ''; }, 2500); }
      }
    };
  });
}

const PEOPLE_TYPE_COLORS = {
  'General Inquiry': '#3d8ef8',
  'Other': '#7b82a6',
  'New Reservation': '#34d399',
  'Confirmation': '#a78bfa',
  'Events': '#fbbf24',
  'Cancellation': '#f87171',
  'NA': '#64748b',
};
const PEAK_COLORS = {
  taken: '#34d399',
  outbound: '#3d8ef8',
  abandoned: '#fbbf24',
  missed: '#f87171',
};

function renderPeopleTypeCharts(j) {
  if (!j?.typeOfCall) return;
  const types = j.typeOfCall.types || [];
  const weekT = j.typeOfCall.totals?.week || { types: {}, total: 0, naPct: 0 };
  const mtdT = j.typeOfCall.totals?.mtd || { types: {}, total: 0, naPct: 0 };
  const weekVals = types.map(t => weekT.types?.[t] || 0);
  const mtdVals = types.map(t => mtdT.types?.[t] || 0);
  const colors = types.map(t => PEOPLE_TYPE_COLORS[t] || '#7b82a6');

  const kpi = document.getElementById('people-type-kpis');
  if (kpi) {
    const top = [...types].sort((a,b)=>(weekT.types?.[b]||0)-(weekT.types?.[a]||0))[0] || '—';
    kpi.innerHTML = `
      <div class="kpi"><div class="kpi-label">Week calls typed</div><div class="kpi-value">${(weekT.total||0).toLocaleString()}</div></div>
      <div class="kpi"><div class="kpi-label">MTD calls typed</div><div class="kpi-value">${(mtdT.total||0).toLocaleString()}</div></div>
      <div class="kpi"><div class="kpi-label">% NA (week)</div><div class="kpi-value ${(weekT.naPct||0)>0.2?'dn':'up'}">${((weekT.naPct||0)*100).toFixed(1)}%</div><div class="kpi-sub">Goal &lt;20%</div></div>
      <div class="kpi"><div class="kpi-label">Top type (week)</div><div class="kpi-value" style="font-size:15px">${top}</div></div>`;
  }

  mkChart('people-type-pie','doughnut',{
    labels: types,
    datasets:[{ data: weekVals, backgroundColor: colors.map(c=>c+'cc'), borderColor: colors, borderWidth: 1 }]
  },{plugins:{legend:{display:true,position:'right',labels:{color:'#c8cde0',boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:ctx=>{
    const v=ctx.raw||0; const tot=weekVals.reduce((s,n)=>s+n,0)||1;
    return ` ${ctx.label}: ${v.toLocaleString()} (${(v/tot*100).toFixed(1)}%)`;
  }}}},scales:{x:{display:false},y:{display:false}}});

  mkChart('people-type-bar','bar',{
    labels: types.map(t => t.replace('General ','Gen. ').replace('New ','New\n')),
    datasets:[
      { label:'Week', data: weekVals, backgroundColor: 'rgba(61,142,248,.7)', borderRadius: 4 },
      { label:'MTD', data: mtdVals, backgroundColor: 'rgba(167,139,250,.55)', borderRadius: 4 },
