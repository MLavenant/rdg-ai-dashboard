<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RDG AI Impact Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<style>
:root{
  --bg:#0d0f18;--surface:#141720;--surface2:#1a1f30;--border:#252d4a;
  --text:#eef0fb;--muted:#8890b8;
  --y25:#ff9f2e;      /* vivid amber — 2025 */
  --y26:#3d8ef8;      /* vivid blue — 2026 */
  --ai:#b06ef5;       /* vivid purple — AI */
  --human:#22d98e;    /* vivid green — Human */
  --red:#ff5c6a;--green:#22d98e;
  --c-mila:#3d8ef8;   /* blue */
  --c-casa:#b06ef5;   /* purple */
  --c-avacg:#22d98e;  /* green */
  --c-avawp:#ff9f2e;  /* amber */
  --c-claudie:#f43f8e;/* pink */
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;min-height:100vh}

/* ── NAV ── */
.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:32px;height:52px;position:sticky;top:0;z-index:100}
.nav-brand{font-weight:700;font-size:15px;color:var(--text);white-space:nowrap}
.nav-brand span{color:var(--ai);margin-right:6px}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab-btn{padding:6px 16px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;border-radius:6px;transition:.15s}
.tab-btn:hover{background:var(--surface2);color:var(--text)}
.tab-btn.active{background:var(--surface2);color:var(--y26);font-weight:600}

/* ── FILTERS ── */
.filters{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.filter-group{display:flex;align-items:center;gap:8px}
.filter-label{color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
select,input[type=number]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--y26)}
.filter-sep{width:1px;height:20px;background:var(--border)}
.last-update{margin-left:auto;color:var(--muted);font-size:11px}

/* ── LAYOUT ── */
.page{display:none;padding:20px 24px;max-width:1600px;margin:0 auto}
.page.active{display:block}

/* ── KPI CARDS ── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative}
.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-size:26px;font-weight:700;line-height:1}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:4px}
.kpi-badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.badge-up{background:rgba(74,222,128,.15);color:var(--green)}
.badge-dn{background:rgba(248,113,113,.15);color:var(--red)}
.badge-neu{background:rgba(167,139,250,.15);color:var(--ai)}
.kpi-split{display:flex;gap:12px;margin-top:6px}
.kpi-split-item{font-size:11px}
.kpi-split-item b{display:block;font-size:15px;font-weight:700}

/* ── CHART GRID ── */
.chart-row{display:grid;gap:16px;margin-bottom:16px}
.chart-row.cols-2{grid-template-columns:1fr 1fr}
.chart-row.cols-3{grid-template-columns:1fr 1fr 1fr}
.chart-row.cols-1{grid-template-columns:1fr}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.chart-card h3{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.chart-card p{font-size:11px;color:var(--muted);margin-bottom:12px}
.chart-wrap{position:relative}

/* ── TABLES ── */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;overflow-x:auto}
.table-card h3{font-size:13px;font-weight:600;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:8px 10px;text-align:right;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
thead th:first-child{text-align:left}
tbody tr{border-bottom:1px solid rgba(42,48,80,.5)}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:8px 10px;text-align:right;white-space:nowrap}
tbody td:first-child{text-align:left;font-weight:600}
.up{color:var(--green)}.dn{color:var(--red)}.neu{color:var(--ai)}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600}
.pill-ai{background:rgba(167,139,250,.2);color:var(--ai)}
.pill-h{background:rgba(52,211,153,.2);color:var(--human)}
tbody tr.total-row{background:rgba(61,142,248,.08);border-top:2px solid var(--border)}
tbody tr.total-row td{font-weight:700;color:var(--text)}
.loc-summary-note{font-size:11px;color:var(--muted);margin:-4px 0 14px}

/* ── BY RESTAURANT ── */
.rest-selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.rest-btn{padding:7px 16px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:20px;cursor:pointer;font-size:13px;transition:.15s}
.rest-btn:hover,.rest-btn.active{background:var(--y26);border-color:var(--y26);color:#fff;font-weight:600}
.golive-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.3);color:var(--ai);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:16px}

/* ── LEGEND ── */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.legend-dot{width:10px;height:10px;border-radius:50%}
.legend-line{width:20px;height:2px}

/* ── SECTION HEADING ── */
.section-head{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:20px 0 12px;display:flex;align-items:center;gap:8px}
.section-head::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── PERIOD SUMMARY (below charts) ── */
.period-summary{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.period-summary table{font-size:12px;width:100%}
.period-summary th,.period-summary td{padding:8px 12px;text-align:center}
.period-summary th:first-child,.period-summary td:first-child{text-align:left}
.period-summary .period-label{font-weight:600;color:var(--muted)}
.period-summary th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
.heat{display:inline-block;padding:3px 10px;border-radius:6px;font-weight:700;font-size:13px;min-width:52px}
.heat-good{background:rgba(52,211,153,.18);color:#34d399}
.heat-mid{background:rgba(251,191,36,.15);color:#fbbf24}
.heat-bad{background:rgba(248,113,113,.18);color:#f87171}
.heat-na{color:var(--muted)}
.stat-note{font-size:10px;color:var(--muted);margin-top:8px;font-style:italic}

/* ── INSIGHT SUMMARY ── */
.insight-banner{background:linear-gradient(135deg,rgba(61,142,248,.12),rgba(176,110,245,.10));border:1px solid rgba(61,142,248,.28);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start}
.insight-banner .insight-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--ai);margin-bottom:4px}
.insight-banner .insight-text{font-size:13px;line-height:1.55;color:var(--text)}
.insight-banner .insight-mark{color:var(--ai);font-size:16px;line-height:1.2;flex-shrink:0}
.insight-banner.verdict{border-color:rgba(176,110,245,.4);background:linear-gradient(135deg,rgba(176,110,245,.14),rgba(61,142,248,.10))}
.insight-banner.verdict .insight-text + .insight-text{margin-top:6px}
.shift-absorbed{color:var(--green);font-weight:600}
.shift-leak{color:var(--red);font-weight:600}

/* ── LOADING ── */
.loading{text-align:center;padding:80px;color:var(--muted);font-size:15px}
.error{text-align:center;padding:40px;color:var(--red)}

/* ── CONVERSATION BUILDING ── */
.conv-build{max-width:720px;margin:48px auto;padding:36px 40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);text-align:center}
.conv-build .pulse{width:56px;height:56px;margin:0 auto 20px;border-radius:50%;background:rgba(176,110,245,.15);border:2px solid rgba(176,110,245,.45);display:flex;align-items:center;justify-content:center;font-size:22px;animation:convPulse 1.6s ease-in-out infinite}
@keyframes convPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(176,110,245,.35)}50%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(176,110,245,0)}}
.conv-build h2{font-size:22px;font-weight:700;margin-bottom:8px;background:linear-gradient(90deg,#3d8ef8,#b06ef5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.conv-build .status{font-size:14px;color:var(--ai);font-weight:600;margin-bottom:14px}
.conv-build p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.conv-build .scope{margin-top:18px;padding:12px 16px;background:var(--surface2);border-radius:10px;font-size:12px;color:var(--text);text-align:left}
.conv-build .scope b{color:var(--ai)}

/* ── SETTINGS / SANITY ── */
.sanity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media(max-width:900px){.sanity-grid{grid-template-columns:1fr}}
.sanity-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.sanity-card h3{font-size:14px;margin-bottom:6px}
.sanity-card .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;margin-bottom:8px}
.badge-ok{background:rgba(52,211,153,.18);color:#34d399}
.badge-warn{background:rgba(251,191,36,.15);color:#fbbf24}
.badge-fail{background:rgba(248,113,113,.18);color:#f87171}
.sanity-card ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.5}
.sanity-card .summary{font-size:13px;color:var(--text)}
.checklist-table td:first-child{font-weight:600}
code.cmd{font-size:11px;background:var(--surface2);padding:2px 6px;border-radius:4px;color:var(--ai)}

/* ── CONVERSATION SAMPLE ── */
.cat-bar{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.cat-row{display:grid;grid-template-columns:180px 1fr 40px;gap:10px;align-items:center;font-size:12px}
.cat-track{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.cat-fill{height:100%;background:linear-gradient(90deg,#3d8ef8,#b06ef5);border-radius:999px}
.conv-table a{color:var(--ai);text-decoration:none}
.conv-table a:hover{text-decoration:underline}
.pill-cat{background:rgba(176,110,245,.18);color:var(--ai)}

/* ── PATTERN / LLM / PEOPLE ── */
.pattern-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.pattern-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.pattern-card h4{font-size:12px;font-weight:700;margin-bottom:6px}
.pattern-card p{font-size:12px;color:var(--muted);line-height:1.5}
.pattern-card.sev-high{border-color:rgba(248,113,113,.35)}
.pattern-card.sev-medium{border-color:rgba(251,191,36,.3)}
.llm-box{background:var(--surface2);border:1px solid rgba(176,110,245,.35);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.people-note{font-size:11px;color:var(--muted);margin-bottom:10px}
.agent-new{color:var(--green);font-size:10px;font-weight:600}
.agent-left{color:var(--red);font-size:10px;font-weight:600}
.people-subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.people-subtab{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.people-subtab.active{background:rgba(61,142,248,.18);border-color:rgba(61,142,248,.45);color:var(--text)}
.people-week-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.people-week-bar label{font-size:12px;color:var(--muted)}
.people-week-bar input{width:64px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
.hours-input{width:72px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px}
.hours-input:focus{border-color:var(--accent);outline:none}
.people-table td,.people-table th{font-size:11px;padding:6px 8px;white-space:nowrap}
.people-table th{position:sticky;top:0;background:var(--surface);z-index:1}
.people-table .grp-start{border-left:2px solid var(--border)}
.peak-wrap{overflow:auto;max-height:520px}
.peak-table td,.peak-table th{font-size:11px;padding:5px 6px;text-align:center}
.peak-table th.time-col{text-align:left;min-width:56px}
.peak-table .day-sep{border-left:2px solid var(--border)}
.ai-row td{color:var(--ai)}
.save-hint{font-size:11px;color:var(--green);margin-left:8px}

</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-brand"><span>◆</span>RDG AI Impact Dashboard</div>
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('overview')">Overview</button>
    <button class="tab-btn" onclick="showTab('byrest')">By Restaurant</button>
    <button class="tab-btn" onclick="showTab('calls')">Call Center</button>
    <button class="tab-btn" onclick="showTab('people')">People</button>
    <button class="tab-btn" onclick="showTab('reservations')">Reservations</button>
    <button class="tab-btn" onclick="showTab('conversation')">Conversation</button>
    <button class="tab-btn" onclick="showTab('settings')">Settings</button>
  </div>
</nav>

<!-- FILTERS -->
<div class="filters">
  <div class="filter-group">
    <span class="filter-label">Location</span>
    <select id="f-location" onchange="applyFilters()">
      <option value="all">All Restaurants</option>
      <option value="mila">MILA</option>
      <option value="casa_neos">Casa Neos</option>
      <option value="ava_cg">AVA CG</option>
      <option value="ava_wp">AVA WP</option>
      <option value="claudie">Claudie</option>
    </select>
  </div>
  <div class="filter-sep"></div>
  <div class="filter-group">
    <span class="filter-label">Week</span>
    <input type="number" id="f-wk-from" min="11" max="52" value="11" style="width:60px" onchange="applyFilters()"/>
    <span class="filter-label">→</span>
    <input type="number" id="f-wk-to" min="1" max="52" value="28" style="width:60px" onchange="applyFilters()"/>
  </div>
  <div class="filter-sep"></div>
  <div class="filter-group">
    <span class="filter-label">Compare</span>
    <select id="f-year" onchange="applyFilters()">
      <option value="both">2025 vs 2026</option>
      <option value="2026">2026 only</option>
      <option value="2025">2025 only</option>
    </select>
  </div>
  <div class="last-update" id="last-update">Loading…</div>
</div>

<!-- PAGES -->
<div id="page-overview" class="page active"><div class="loading">Loading data…</div></div>
<div id="page-byrest"   class="page"><div class="loading">Loading data…</div></div>
<div id="page-calls"    class="page"><div class="loading">Loading data…</div></div>
<div id="page-people"   class="page"><div class="loading">Loading people data…</div></div>
<div id="page-reservations" class="page"><div class="loading">Loading data…</div></div>
<div id="page-conversation" class="page"><div class="loading">Loading data…</div></div>
<div id="page-settings" class="page"><div class="loading">Loading data…</div></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let D = null;          // raw /api/compare response
let F = {};            // current filter state
const CHARTS = {};     // chart instances keyed by canvas id

const RESTS = [
  {id:'mila',      label:'MILA',      color:'#3d8ef8', goLive:23},
  {id:'casa_neos', label:'Casa Neos', color:'#b06ef5', goLive:23},
  {id:'ava_cg',    label:'AVA CG',    color:'#22d98e', goLive:19},
  {id:'ava_wp',    label:'AVA WP',    color:'#ff9f2e', goLive:23},
  {id:'claudie',   label:'Claudie',   color:'#f43f8e', goLive:20},
];
// Analysis window — W1–W10 excluded (incomplete TalkDesk / booking alignment in early 2025)
const ANALYSIS_START_WEEK = 11;

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
async function loadCompare() {
  // Local Express server first; GitHub Pages falls back to static compare.json
  const onStaticHost = /github\.io$/i.test(location.hostname) || location.protocol === 'file:';
  if (!onStaticHost) {
    try {
      const r = await fetch('/api/compare');
      if (r.ok) {
        const j = await r.json();
        if (j?.ok !== false && Array.isArray(j.rows26)) return j;
      }
    } catch (_) { /* static host */ }
  }
  let dir = location.pathname || '/';
  if (dir.endsWith('.html')) dir = dir.replace(/\/[^/]+$/, '/');
  else if (!dir.endsWith('/')) dir = dir + '/';
  const r2 = await fetch(dir + 'compare.json');
  if (!r2.ok) throw new Error('Could not load /api/compare or ./compare.json');
  return r2.json();
}

async function init() {
  try {
    D = await loadCompare();
    document.getElementById('f-wk-from').value = ANALYSIS_START_WEEK;
    document.getElementById('f-wk-to').value = D.cutoff;
    document.getElementById('last-update').textContent = `Updated W${D.cutoff} · Analysis from W${ANALYSIS_START_WEEK}`;
    F = { location:'all', wkFrom:ANALYSIS_START_WEEK, wkTo:D.cutoff, year:'both' };
    renderAll();
  } catch(e) {
    document.querySelectorAll('.page').forEach(p => p.innerHTML = `<div class="error">Error loading data: ${e.message}</div>`);
  }
}

function applyFilters() {
  F.location = document.getElementById('f-location').value;
  F.wkFrom   = Math.max(ANALYSIS_START_WEEK, +document.getElementById('f-wk-from').value || ANALYSIS_START_WEEK);
  F.wkTo     = +document.getElementById('f-wk-to').value || D.cutoff;
  F.year     = document.getElementById('f-year').value;
  renderAll();
}

function renderAll() {
  renderOverview();
  renderByRest();
  renderCalls();
  renderPeople();
  renderReservations();
  renderConversation();
  renderSettings();
}

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════
function filtered(rows, year=null) {
  if (!rows) return [];
  return rows.filter(r => {
    if (F.location !== 'all' && r.restaurantId !== F.location) return false;
    if (r.week < F.wkFrom || r.week > F.wkTo) return false;
    if (year && r.year !== year) return false;
    return true;
  });
}

// Week-only filter — ignores location dropdown (used in All Restaurants comparison)
function filteredWeeks(rows) {
  if (!rows) return [];
  return rows.filter(r => r.week >= F.wkFrom && r.week <= F.wkTo);
}

// Metric formulas (same for 2025 & 2026):
//   Human Calls = total calls where agent ≠ If-No-Answer Agent and agent ≠ empty  → callsHuman
//   AI Calls    = total calls where agent = If-No-Answer Agent only               → callsAI
//   Human Conv% = Phone/In-House bookings ÷ Human Calls
//   AI Conv%    = Phone/AI bookings ÷ AI Calls
//   Total Conv% = (Phone/In-House + Phone/AI) ÷ (Human Calls + AI Calls)

function humanConvRate(row) {
  if (!row) return null;
  const h = row.callsHuman || 0;
  return h > 0 ? row.bookingsPhoneHuman / h * 100 : null;
}
function humanConvRateAgg(rows) {
  const books = sum(rows, 'bookingsPhoneHuman');
  const h = sum(rows, 'callsHuman');
  return h > 0 ? books / h * 100 : 0;
}
function aiConvRate(row) {
  if (!row) return null;
  const ai = row.callsAI || 0;
  return ai > 0 ? (row.bookingsPhoneAI || 0) / ai * 100 : null;
}
function aiConvRateAgg(rows) {
  const books = sum(rows, 'bookingsPhoneAI');
  const ai = sum(rows, 'callsAI');
  return ai > 0 ? books / ai * 100 : 0;
}
function totalConvRate(row) {
  if (!row) return null;
  const denom = (row.callsHuman || 0) + (row.callsAI || 0);
  return denom > 0 ? ((row.bookingsPhoneHuman||0) + (row.bookingsPhoneAI||0)) / denom * 100 : null;
}
function totalConvRateAgg(rows) {
  const books = sum(rows,'bookingsPhoneHuman') + sum(rows,'bookingsPhoneAI');
  const denom = sum(rows,'callsHuman') + sum(rows,'callsAI');
  return denom > 0 ? books / denom * 100 : 0;
}

// Hostie transfer rate: "Transferred to Host" = TRUE ÷ total Hostie AI calls (by location)
function hostieTransferRate(row) {
  if (!row) return null;
  const ai = row.hostieAiCalls || 0;
  return ai > 0 ? (row.hostieTransferred || 0) / ai * 100 : null;
}
function hostieTransferRateAgg(rows) {
  const ai = sum(rows, 'hostieAiCalls');
  const tr = sum(rows, 'hostieTransferred');
  return ai > 0 ? tr / ai * 100 : null;
}
function hostieResolveRateAgg(rows) {
  const ai = sum(rows, 'hostieAiCalls');
  const res = sum(rows, 'hostieAiResolved');
  return ai > 0 ? res / ai * 100 : null;
}
function fmtHostiePct(v) {
  return v != null && !isNaN(v) ? v.toFixed(1) + '%' : '—';
}

function insightBanner(text) {
  if (!text) return '';
  return `<div class="insight-banner"><div class="insight-mark">◆</div><div><div class="insight-label">AI Impact Snapshot</div><div class="insight-text">${text}</div></div></div>`;
}

function signedPct(cur, prior) {
  if (!(prior > 0)) return null;
  return ((cur - prior) / prior) * 100;
}
function fmtSigned(v, unit='%') {
  if (v == null || isNaN(v)) return '—';
  const sign = v > 0 ? '+' : '';
  return `${sign}${v.toFixed(1)}${unit}`;
}

/** Sharp 1–2 line YoY verdict: calls, conversion, phone→AI/other transfer */
function buildYoyVerdict(r26, r25) {
  const c26 = sum(r26, 'callsTotal'), c25 = sum(r25, 'callsTotal');
  const cVar = signedPct(c26, c25);
  const b26 = sum(r26, 'bookingsTotal'), b25 = sum(r25, 'bookingsTotal');
  const bVar = signedPct(b26, b25);
  const ph25 = sum(r25, 'bookingsPhoneHuman');
  const ph26 = sum(r26, 'bookingsPhoneHuman');
  const ai26 = sum(r26, 'bookingsPhoneAI');
  const phoneLoss = ph25 - ph26; // >0 = lost human phone books
  const h26 = humanConvRateAgg(r26), h25 = humanConvRateAgg(r25);
  const convDelta = h26 - h25;
  const otDelta = sum(r26, 'bookingsOTNetwork') - sum(r25, 'bookingsOTNetwork');
  const otherDelta =
    (sum(r26, 'bookingsYourNetwork') + sum(r26, 'bookingsWalkIn')) -
    (sum(r25, 'bookingsYourNetwork') + sum(r25, 'bookingsWalkIn'));

  const callsTxt = cVar == null
    ? 'Call volume YoY is unclear'
    : (cVar >= 0
      ? `Calls are <b>up ${fmtSigned(cVar)}</b> vs same weeks 2025`
      : `Calls are <b>down ${fmtSigned(cVar)}</b> vs same weeks 2025`);
  const convTxt = Math.abs(convDelta) < 1
    ? `Human conversion is <b>held</b> (${h25.toFixed(1)}% → ${h26.toFixed(1)}%)`
    : (convDelta >= 0
      ? `Human conversion is <b>protected</b> (${h25.toFixed(1)}% → ${h26.toFixed(1)}%, +${convDelta.toFixed(1)}pp)`
      : `Human conversion is <b>down ${Math.abs(convDelta).toFixed(1)}pp</b> (${h25.toFixed(1)}% → ${h26.toFixed(1)}%)`);

  let shiftTxt;
  if (phoneLoss <= 0) {
    shiftTxt = `Phone/In-House is <b>not down</b> YoY; Phone/AI added <b>${ai26.toLocaleString()}</b>. Total reservations <b>${fmtSigned(bVar)}</b> — AI is not costing reservations.`;
  } else if (ai26 >= phoneLoss) {
    shiftTxt = `Phone/In-House dropped <b>${phoneLoss.toLocaleString()}</b>, fully offset by Phone/AI (<b>${ai26.toLocaleString()}</b>). Total reservations <b>${fmtSigned(bVar)}</b>${otDelta ? `; OT Network ${otDelta > 0 ? '+' : ''}${otDelta.toLocaleString()}` : ''} — phone mix shifted to AI, not lost.`;
  } else if (bVar != null && bVar >= 0) {
    const pctAi = ((ai26 / phoneLoss) * 100).toFixed(0);
    shiftTxt = `Phone/In-House dropped <b>${phoneLoss.toLocaleString()}</b>; AI recovered <b>${ai26.toLocaleString()}</b> (${pctAi}%). Remainder went to other channels (OT ${otDelta >= 0 ? '+' : ''}${otDelta.toLocaleString()}, web/walk-in ${otherDelta >= 0 ? '+' : ''}${otherDelta.toLocaleString()}). <b>Not losing reservations overall</b> (${fmtSigned(bVar)}).`;
  } else {
    shiftTxt = `Phone/In-House dropped <b>${phoneLoss.toLocaleString()}</b>; AI recovered only <b>${ai26.toLocaleString()}</b>. OT ${otDelta >= 0 ? '+' : ''}${otDelta.toLocaleString()}, web/walk-in ${otherDelta >= 0 ? '+' : ''}${otherDelta.toLocaleString()}. Total reservations <b>${fmtSigned(bVar)}</b> — some phone volume looks <b>lost, not fully transferred</b>.`;
  }
  return { line1: `${callsTxt}. ${convTxt}.`, line2: shiftTxt };
}

function yoyVerdictBanner(r26, r25) {
  const v = buildYoyVerdict(r26, r25);
  return `<div class="insight-banner verdict"><div class="insight-mark">◆</div><div>
    <div class="insight-label">YoY Verdict — W${F.wkFrom}–W${F.wkTo}</div>
    <div class="insight-text">${v.line1}</div>

  </div></div>`;
}

function buildOverviewInsight(r26, r25) {

  const src = channelShiftSources();

}

/** Waterfall: 2025 total → source deltas → 2026 total (one glance: win/lose + why) */
function reservationWaterfallSteps(r26, r25) {
  const t25 = sum(r25, 'bookingsTotal');
  const t26 = sum(r26, 'bookingsTotal');
  const src = channelShiftSources();
  const deltas = src.map(s => ({
    label: s.label,
    color: s.color,
    delta: sum(r26, s.key) - sum(r25, s.key),
  }));
  const accounted = deltas.reduce((s, d) => s + d.delta, 0);
  const residual = (t26 - t25) - accounted;
  if (Math.abs(residual) >= 1) {
    deltas.push({ label: 'Other', color: '#8890b8', delta: residual });
  }
  return { t25, t26, deltas };
}

function buildReservationWaterfall(canvasId, r26, r25) {
  const { t25, t26, deltas } = reservationWaterfallSteps(r26, r25);
  const labels = ['2025 Total', ...deltas.map(d => d.label), '2026 Total'];
  const base = [];
  const vals = [];
  const colors = [];
  let run = t25;
  base.push(0); vals.push(t25); colors.push('rgba(255,159,46,.85)');
  deltas.forEach(d => {
    if (d.delta >= 0) {
      base.push(run);
      vals.push(d.delta);
      colors.push(d.color + 'cc');
    } else {
      base.push(run + d.delta);
      vals.push(-d.delta);
      colors.push(d.color + '99');
    }
    run += d.delta;
  });
  base.push(0); vals.push(t26);
  colors.push(t26 >= t25 ? 'rgba(34,217,142,.85)' : 'rgba(255,92,106,.85)');

  mkChart(canvasId, 'bar', {
    labels,
    datasets: [
      {
        label: 'base',
        data: base,
        backgroundColor: 'transparent',
        borderWidth: 0,
        stack: 'wf',
        tooltip: { enabled: false },
      },
      {
        label: 'Reservations',
        data: vals,
        backgroundColor: colors,
        borderRadius: 4,
        stack: 'wf',
      },
    ],
  }, mergeChartOptions(Y_AUTO, {
    plugins: {
      legend: { display: false },
      tooltip: {
        filter: (item) => item.datasetIndex === 1,
        callbacks: {
          label: (ctx) => {
            const i = ctx.dataIndex;
            if (i === 0) return `2025 Total: ${t25.toLocaleString()}`;
            if (i === labels.length - 1) return `2026 Total: ${t26.toLocaleString()} (${t26 - t25 >= 0 ? '+' : ''}${(t26 - t25).toLocaleString()})`;
            const d = deltas[i - 1];
            return `${d.label}: ${d.delta >= 0 ? '+' : ''}${d.delta.toLocaleString()}`;
          },
        },
      },
    },
    scales: {
      x: { stacked: true, ticks: { color: '#8890b8', maxRotation: 40, font: { size: 10 } } },
      y: {
        stacked: true,
        title: { display: true, text: 'Reservations', color: '#8890b8' },
        ticks: { color: '#8890b8' },
        grid: { color: 'rgba(37,45,74,.6)' },
      },
    },
  }));
}

/** One-sentence location insight (uses go-live for post-AI view when available) */
function buildRestInsight(rest, r26, r25) {
  const post26 = r26.filter(r => r.isPostAI);
  const postWeeks = new Set(post26.map(r => r.week));
  const post25 = r25.filter(r => postWeeks.has(r.week));
  const scope26 = post26.length ? post26 : r26;
  const scope25 = post26.length ? post25 : r25;
  const label = post26.length ? `Since AI live (W${rest.goLive}+)` : `W${F.wkFrom}–W${F.wkTo}`;

  const b26 = sum(scope26,'bookingsTotal'), b25 = sum(scope25,'bookingsTotal');
  const bVar = signedPct(b26, b25);
  const phone26 = sum(scope26,'bookingsPhoneHuman') + sum(scope26,'bookingsPhoneAI');
  const phone25 = sum(scope25,'bookingsPhoneHuman');
  const phoneVar = signedPct(phone26, phone25);
  const bAI = sum(scope26,'bookingsPhoneAI');
  const a26 = abnRate(scope26), a25 = abnRate(scope25);
  const abnDelta = (a25 != null && a26 != null) ? (a25 - a26) : null;
  const transfer = hostieTransferRateAgg(scope26);
  const aiConv = aiConvRateAgg(scope26);
  const bookDir = bVar == null ? 'unclear (limited 2025 baseline)' : bVar >= 0 ? 'up' : 'down';
  const abnText = abnDelta == null ? '' :
    (abnDelta >= 0
      ? `abandoned improved ${abnDelta.toFixed(1)}pp`
      : `abandoned worsened ${Math.abs(abnDelta).toFixed(1)}pp`);
  return `${label}: <b>${rest.label}</b> total reservations are <b>${fmtSigned(bVar)}</b> vs same weeks in 2025; phone bookings <b>${fmtSigned(phoneVar)}</b> YoY with <b>${bAI.toLocaleString()}</b> Phone/AI books (AI conv <b>${aiConv.toFixed(1)}%</b>). ` +
    `Hostie transfer rate is <b>${fmtHostiePct(transfer)}</b>${abnText ? `; ${abnText}` : ''}. Net view: reservations are <b>${bookDir}</b> vs last year in the AI window — pair this with OT Network mix below to see if AI is the driver or a substitute for human phone.`;
}

// Period slices for summary tables (Last Week, MTD ~4 wks, YTD)
function periodRows(rows, period) {
  const lw = D.lastWeek, cutoff = D.cutoff;
  if (period === 'lw') return rows.filter(r => r.week === lw);
  if (period === 'mtd') return rows.filter(r => r.week > cutoff - 4 && r.week <= cutoff);
  return rows; // ytd (already filtered W1–cutoff)
}

function abnRate(rows) {
  const t = sum(rows,'callsTotal'), a = sum(rows,'callsAbandoned');
  return t > 0 ? a/t*100 : null;
}
function abnRateFmt(rows) {
  const v = abnRate(rows);
  return v != null ? v.toFixed(1)+'%' : '—';
}

// Heat coloring: green = good, red = bad
function heatConv(v) {
  if (v == null || isNaN(v)) return '<span class="heat-na">—</span>';
  const cls = v >= 42 ? 'heat-good' : v >= 32 ? 'heat-mid' : 'heat-bad';
  return `<span class="heat ${cls}">${v.toFixed(1)}%</span>`;
}
function heatAbn(v) {
  if (v == null || isNaN(v)) return '<span class="heat-na">—</span>';
  const cls = v <= 15 ? 'heat-good' : v <= 28 ? 'heat-mid' : 'heat-bad';
  return `<span class="heat ${cls}">${v.toFixed(1)}%</span>`;
}
function heatYoY(cur, prior, higherIsBetter) {
  if (cur == null || prior == null || isNaN(cur) || isNaN(prior)) return heatConv(cur);
  const better = higherIsBetter ? cur >= prior : cur <= prior;
  const cls = better ? 'heat-good' : 'heat-bad';
  const arrow = cur > prior ? '▲' : cur < prior ? '▼' : '—';
  return `<span class="heat ${cls}">${cur.toFixed(1)}% <span style="font-size:9px;opacity:.8">${arrow}</span></span>`;
}

function buildConvSummaryTable(r26, r25) {

    { key:'lw', label:`Last Week (W${D.lastWeek})` },
    { key:'mtd', label:'MTD (last 4 wks)' },

  ];
  const rows = periods.map(p => {
    const s26 = periodRows(r26, p.key), s25 = periodRows(r25, p.key);

    return `<tr>
      <td class="period-label">${p.label}</td>
      <td>${heatConv(h25)}</td>
      <td>${heatYoY(h26, h25, true)}</td>
      <td>${heatConv(ai)}</td>
      <td>${heatConv(tot)}</td>
    </tr>`;
  }).join('');
  return `<div class="period-summary">
    <table>
      <thead><tr>
        <th></th>
        <th>Human Conv % 2025</th>
        <th>Human Conv % 2026</th>
        <th>AI Conv % 2026</th>

}

      <thead><tr>
        <th></th><th>Abandoned % 2025</th><th>Abandoned % 2026</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="stat-note">Abandoned % = abandoned calls ÷ total TalkDesk calls (inbound + abandoned + outbound)</div>
  </div>`;
}

function buildPhoneSummaryTable(r26, r25) {
  const periods = [
    { key:'lw', label:`Last Week (W${D.lastWeek})` },
    { key:'mtd', label:'MTD (last 4 wks)' },
    { key:'ytd', label:`YTD (W${ANALYSIS_START_WEEK}–W${D.cutoff})` },
  ];
  const rows = periods.map(p => {
    const s26 = periodRows(r26, p.key), s25 = periodRows(r25, p.key);
    const p25 = sum(s25,'bookingsPhoneHuman');
    const p26 = sum(s26,'bookingsPhoneHuman') + sum(s26,'bookingsPhoneAI');
    const delta = p25 > 0 ? ((p26-p25)/p25*100) : 0;
    const cls = delta >= 0 ? 'heat-good' : 'heat-bad';
    return `<tr>
      <td class="period-label">${p.label}</td>
      <td>${p25.toLocaleString()}</td>
      <td><span class="heat ${cls}">${p26.toLocaleString()}</span></td>
      <td style="color:var(--ai)">${sum(s26,'bookingsPhoneAI').toLocaleString()}</td>
    </tr>`;
  }).join('');
  return `<div class="period-summary">
    <table>
      <thead><tr>
        <th></th><th>Phone Books 2025</th><th>Total Phone 2026</th><th>via AI 2026</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function sum(rows, field) { return rows.reduce((s,r) => s + (r[field]||0), 0); }

function pct(num, den) { return den > 0 ? (num/den*100).toFixed(1)+'%' : '—'; }

function fmt(n) { return n == null ? '—' : n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n); }

function yoyBadge(v26, v25) {
  if (!v25) return '';
  const d = (v26-v25)/v25*100;
  const cls = d > 0 ? 'badge-up' : d < 0 ? 'badge-dn' : 'badge-neu';
  const sign = d > 0 ? '▲' : '▼';
  return `<span class="kpi-badge ${cls}">${sign}${Math.abs(d).toFixed(1)}%</span>`;
}

function mergeChartOptions(base, extra) {
  const out = { ...base, ...extra };
  if (base.scales || extra.scales) {
    out.scales = { ...(base.scales || {}) };
    for (const key of Object.keys(extra.scales || {})) {
      out.scales[key] = { ...(base.scales?.[key] || {}), ...extra.scales[key] };
    }
  }
  if (base.plugins || extra.plugins) {
    out.plugins = { ...base.plugins, ...extra.plugins };
    if (base.plugins?.annotation || extra.plugins?.annotation) {
      out.plugins.annotation = { ...(base.plugins?.annotation || {}), ...(extra.plugins?.annotation || {}) };
    }
  }
  return out;
}

// YoY variance bars may be negative — let Chart.js auto-scale
const Y_AUTO = { scales: { y: { min: undefined } } };

function mkChart(id, type, data, options={}) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  if (CHARTS[id]) { CHARTS[id].destroy(); delete CHARTS[id]; }
  const defaults = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y?.toLocaleString() ?? ctx.parsed}` } },
    },
    scales: {
      x: { grid: { color: 'rgba(42,48,80,.5)' }, ticks: { color: '#7b82a6', maxRotation: 0 } },
      y: { min: 0, grid: { color: 'rgba(42,48,80,.5)' }, ticks: { color: '#7b82a6' } },
    },
  };
  CHARTS[id] = new Chart(canvas, { type, data, options: mergeChartOptions(defaults, options) });
  return CHARTS[id];
}

function weekLabels(rows) {
  const wks = [...new Set(rows.map(r=>r.week))].sort((a,b)=>a-b);
  return wks.map(w => 'W'+w);
}

function aggByWeek(rows, field) {
  const map = {};
  rows.forEach(r => { map[r.week] = (map[r.week]||0) + (r[field]||0); });
  return map;
}

function getWeeks() {
  const wks = new Set();
  (D.rows26||[]).forEach(r => { if(r.week>=F.wkFrom && r.week<=F.wkTo) wks.add(r.week); });
  (D.rows25||[]).forEach(r => { if(r.week>=F.wkFrom && r.week<=F.wkTo) wks.add(r.week); });
  return [...wks].sort((a,b)=>a-b);
}

function annoGoLive(goLiveWeek, weeks) {
  const idx = weeks.indexOf(goLiveWeek);
  if (idx < 0) return {};
  return { 'go-live': { type:'line', xMin:idx, xMax:idx, borderColor:'rgba(167,139,250,.8)', borderWidth:2, borderDash:[4,3],
    label:{ content:'AI Live', display:true, color:'#a78bfa', font:{size:10}, position:'start' }}};
}

    const rate25 = t25>0 ? a25/t25*100 : 0, rate26 = t26>0 ? a26/t26*100 : 0;
    return +(rate25-rate26).toFixed(1);

function varPctCell(cur, prior) {
  if (!(prior > 0)) return '<td class="neu">—</td>';
  const v = ((cur - prior) / prior) * 100;
  const cls = v >= 0 ? 'up' : 'dn';
  const sign = v > 0 ? '+' : '';
  return `<td class="${cls}">${sign}${v.toFixed(1)}%</td>`;
}
function convYoYCell(cur, prior) {
  if (cur == null || isNaN(cur)) return '<td>—</td>';
  if (prior == null || isNaN(prior) || !(prior > 0) && prior !== 0) {
    return `<td>${cur.toFixed(1)}%</td>`;
  }
  const better = cur >= prior;
  const cls = better ? 'up' : 'dn';
  return `<td class="${cls}">${cur.toFixed(1)}%</td>`;
}
function phoneBooks(rows) {
  return sum(rows, 'bookingsPhoneHuman') + sum(rows, 'bookingsPhoneAI');
}
function locSummaryScope(rowsAll, period) {
  const cutoff = D.cutoff;
  let rows = rowsAll || [];
  if (F.location && F.location !== 'all') {
    rows = rows.filter(r => r.restaurantId === F.location);
  }
  if (period === 'mtd') {
    const from = Math.max(ANALYSIS_START_WEEK, cutoff - 3);
    return rows.filter(r => r.week >= from && r.week <= cutoff);
  }
  return rows.filter(r => r.week >= ANALYSIS_START_WEEK && r.week <= cutoff);
}
function locSummaryRowHtml(labelHtml, r26, r25, isTotal) {
  const c26 = sum(r26, 'callsTotal'), c25 = sum(r25, 'callsTotal');
  const b26 = sum(r26, 'bookingsTotal'), b25 = sum(r25, 'bookingsTotal');
  const p26 = phoneBooks(r26), p25 = phoneBooks(r25);
  const h26 = humanConvRateAgg(r26), h25 = humanConvRateAgg(r25);
  const a26 = aiConvRateAgg(r26), a25 = aiConvRateAgg(r25);
  const h25Html = sum(r25, 'callsHuman') > 0 ? `${h25.toFixed(1)}%` : '—';
  const ai26Html = sum(r26, 'callsAI') > 0 ? `${a26.toFixed(1)}%` : '—';
  const ai25Html = sum(r25, 'callsAI') > 0 ? `${a25.toFixed(1)}%` : '—';
  return `<tr class="${isTotal ? 'total-row' : ''}">
    <td>${labelHtml}</td>
    <td>${c26.toLocaleString()}</td><td>${c25.toLocaleString()}</td>${varPctCell(c26, c25)}
    <td>${b26.toLocaleString()}</td><td>${b25.toLocaleString()}</td>${varPctCell(b26, b25)}
    <td>${p26.toLocaleString()}</td><td>${p25.toLocaleString()}</td>${varPctCell(p26, p25)}
    ${convYoYCell(h26, h25)}<td>${h25Html}</td>
    <td style="color:var(--ai)">${ai26Html}</td><td>${ai25Html}</td>
  </tr>`;
}

function buildLocSummaryTable(tbodyId, period) {
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  const rests = (F.location && F.location !== 'all')
    ? RESTS.filter(r => r.id === F.location)
    : RESTS;
  const rows = rests.map(rest => {
    const r26 = locSummaryScope(D.rows26, period).filter(r => r.restaurantId === rest.id);
    const r25 = locSummaryScope(D.rows25, period).filter(r => r.restaurantId === rest.id);
    return locSummaryRowHtml(
      `<span style="color:${rest.color}">●</span> ${rest.label}`,
      r26, r25, false
    );
  });
  const all26 = locSummaryScope(D.rows26, period).filter(r => rests.some(x => x.id === r.restaurantId));
  const all25 = locSummaryScope(D.rows25, period).filter(r => rests.some(x => x.id === r.restaurantId));
  rows.push(locSummaryRowHtml('Total', all26, all25, true));
  tbody.innerHTML = rows.join('');
}

    </tr>`;
  }).join('');
}

let _peopleStatic = null;   // cached ./people.json when no backend
let _peopleReadOnly = false; // true on GitHub Pages (no POST endpoint)

/** Resolve a static asset next to the dashboard (works with/without trailing slash). */
function staticAssetUrl(name) {
  let dir = location.pathname || '/';
  if (dir.endsWith('.html')) dir = dir.replace(/\/[^/]+$/, '/');
  else if (!dir.endsWith('/')) dir = dir + '/';
  return dir + name;
}

async function fetchJsonSafe(url) {
  const r = await fetch(url);
  const text = await r.text();
  const trimmed = (text || '').trim();
  if (!r.ok || !trimmed.startsWith('{') && !trimmed.startsWith('[')) {
    return null;
  }
  try { return JSON.parse(trimmed); } catch { return null; }
}

async function loadPeople(week) {
  const onStaticHost = /github\.io$/i.test(location.hostname) || location.protocol === 'file:';

  // Local Express API (skip on GitHub Pages — /api/* is not under the project path)
  if (!onStaticHost) {
    const j = await fetchJsonSafe(`/api/people?week=${week}`);
    if (j && j.ok) { _peopleReadOnly = false; return j; }
  }

  if (!_peopleStatic) {
    const bust = 'v=20260716b';
    _peopleStatic = await fetchJsonSafe(staticAssetUrl('people.json') + '?' + bust);
    if (!_peopleStatic) {
      _peopleStatic = await fetchJsonSafe('./people.json?' + bust);
    }
  }
  if (!_peopleStatic) {
    throw new Error('People snapshot missing. Re-export with: npm run dashboard:export');
  }
  _peopleReadOnly = true;
  const weeks = _peopleStatic.weeks || {};
  const pick = weeks[String(week)] || weeks[String(_peopleStatic.latestWeek)] || Object.values(weeks)[0];
  if (!pick) throw new Error('No people data available in snapshot');
  return pick;
}

async function renderPeople() {
  const el = document.getElementById('page-people');
  if (!el) return;
  el.innerHTML = `<div class="loading">Loading Reservation Call Report…</div>`;
  try {
    const week = F.wkTo || D.cutoff || 24;
    const j = await loadPeople(week);
    if (!j.ok) {
      el.innerHTML = `<div class="table-card"><p>${j.error || 'People report not available.'}</p>
        <div class="stat-note">Ensure TalkDesk CSV is in <code>data/</code> and the dashboard server is running.</div></div>`;
      return;
    }

    const fmtPct = (v) => v == null ? '—' : `${(v * 100).toFixed(1)}%`;
    const fmtSecs = (s) => {
      if (!s) return '0s';
      if (s >= 3600) return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
      if (s >= 60) return `${Math.floor(s/60)}m ${s%60}s`;
      return `${Math.round(s * 10) / 10}s`;
    };
    const fmtNum = (n) => (n ?? 0).toLocaleString();
    const fmtCph = (v) => v == null ? '—' : v.toFixed(2);

    const periodHdr = (label, sub) =>
      `<th colspan="9" class="grp-start">${label}<div style="font-weight:400;font-size:10px;color:var(--muted)">${sub}</div></th>`;

    const ringMetricCells = (m, agentName, period, editable) => {
      const wh = m.workedHours;
      const hoursCell = (editable && !_peopleReadOnly)
        ? `<td><input class="hours-input" type="number" min="0" step="0.01" data-agent="${agentName}" data-period="${period}" value="${wh != null ? wh : ''}" placeholder="hrs" title="Edit worked hours — saves on blur"></td>`
        : `<td>${wh != null ? wh : '—'}</td>`;
      return `
        <td class="grp-start">${fmtNum(m.calls)}</td>
        <td>${fmtPct(m.pct)}</td>
        ${hoursCell}
        <td>${fmtCph(m.callsPerHour)}</td>
        <td>${fmtSecs(m.avgTalkSecs)}</td>
        <td>${fmtSecs(m.maxTalkSecs)}</td>
        <td>${fmtSecs(m.asaSecs)}</td>
        <td>${fmtNum(m.missed)}</td>
        <td>${fmtPct(m.missedPct)}</td>`;
    };

    const ringRows = (j.ringGroups.agents || []).map(a => `
      <tr class="${a.isAi ? 'ai-row' : ''}">
        <td style="text-align:left">${a.isAi ? 'AI Agent' : a.agentName}</td>
        ${ringMetricCells(a.week, a.agentName, 'week', !a.isAi)}
        ${ringMetricCells(a.mtd, a.agentName, 'mtd', !a.isAi)}
      </tr>`).join('');

    const t = j.ringGroups.totals;
    const ringTotalRow = `
      <tr style="font-weight:700">
        <td style="text-align:left">Total</td>
        ${ringMetricCells(t.week, '', 'week', false)}
        ${ringMetricCells(t.mtd, '', 'mtd', false)}
      </tr>`;

    const typeCols = (j.typeOfCall.types || []);
    const typeHdr = typeCols.map(c => `<th>${c}</th>`).join('') + '<th>% NA</th><th>Total</th>';
    const typeCells = (b) => typeCols.map(c => `<td>${fmtNum(b.types?.[c])}</td>`).join('')
      + `<td>${fmtPct(b.naPct)}</td><td>${fmtNum(b.total)}</td>`;

    const typeAgentRows = (j.typeOfCall.agents || []).map(a => `
      <tr class="${a.isAi ? 'ai-row' : ''}">
        <td style="text-align:left">${a.isAi ? 'AI Agent' : a.agentName}</td>
        ${typeCols.map(c => `<td>${fmtNum(a.week.types?.[c])}</td>`).join('')}
        <td>${fmtPct(a.week.naPct)}</td>
        <td>${fmtNum(a.week.total)}</td>
      </tr>`).join('');

    const peakDays = j.peakTimes.days || [];
    const peakHours = j.peakTimes.hours || [];
    const peakHdr = peakDays.map(d => `<th colspan="4" class="day-sep">${d}</th>`).join('')
      + '<th colspan="4" class="day-sep">TOTAL</th>';
    const peakSub = peakDays.map(() =>
      '<th class="day-sep">Taken</th><th>Missed</th><th>Outbound</th><th>Abandoned</th>'
    ).join('') + '<th class="day-sep">Taken</th><th>Missed</th><th>Outbound</th><th>Abandoned</th>';

    const peakRows = peakHours.map(hour => {
      const row = j.peakTimes.grid?.[hour] || {};
      let rt=0, rm=0, ro=0, ra=0;
      const dayCells = peakDays.map(day => {
        const c = row[day] || { taken:0, missed:0, outbound:0, abandoned:0 };
        rt += c.taken; rm += c.missed; ro += c.outbound; ra += c.abandoned;
        return `<td class="day-sep">${c.taken}</td><td>${c.missed}</td><td>${c.outbound}</td><td>${c.abandoned}</td>`;
      }).join('');
      return `<tr><th class="time-col">${hour}</th>${dayCells}<td class="day-sep">${rt}</td><td>${rm}</td><td>${ro}</td><td>${ra}</td></tr>`;
    }).join('');

    const tot = j.peakTimes.totals || { taken:0, missed:0, outbound:0, abandoned:0 };

      <td>${tot.outbound}<div style="font-size:10px;color:var(--muted)">${fmtPct(tot.outbound/peakGrand)}</div></td>

    el.innerHTML = `
      <div class="section-head">People — Reservation Call Report</div>
      ${insightBanner(`Matches Excel <b>Reservation Call Report</b>: Ring Groups, Type of Call, and Peak Times. Week uses dashboard filter <b>W${j.selectedWeek}</b>; MTD = <b>W${j.mtdFromWeek}–W${j.mtdToWeek}</b> (4-week period). ${_peopleReadOnly ? '<b>Worked Hours</b> are view-only on the shared link — edit them in the local dashboard.' : '<b>Worked Hours</b> are editable — enter payroll hours to compute Call Per Hour.'}`)}
      <div class="people-week-bar">
        <label>Report week</label>
        <input type="number" id="people-week" min="1" max="53" value="${j.selectedWeek}">
        <button class="rest-btn" id="people-week-go" style="padding:6px 12px">Apply</button>
        <span class="people-note">Source: ${j.sources?.csv || '—'} · Generated ${j.generatedAt ? new Date(j.generatedAt).toLocaleString() : '—'}<span id="people-save-hint"></span></span>
      </div>
      <div class="people-subtabs" id="people-subtabs">
        <button class="people-subtab active" data-people-panel="ring">Summary — Ring Groups</button>
        <button class="people-subtab" data-people-panel="type">Summary — Type of Call</button>
        <button class="people-subtab" data-people-panel="peak">Summary — Peak Times BreakDown</button>
      </div>

      <div id="people-panel-ring">
        <div class="table-card" style="overflow:auto">
          <h3>Summary — Ring Groups</h3>
          <p class="people-note"># calls = inbound + outbound · ASA = avg Agent Speed to Answer · AI Agent row = If-No-Answer Agent</p>

            <thead>
              <tr>
                <th rowspan="2">Agent</th>
                ${periodHdr(`Week ${j.selectedWeek}`, 'Current week')}
                ${periodHdr(`MTD W${j.mtdFromWeek}–${j.mtdToWeek}`, '4-week period')}

                <th class="grp-start">#</th><th>%</th><th>Worked Hrs</th><th>Call/Hr</th><th>Avg Talk</th><th>Max Talk</th><th>ASA</th><th># Missed</th><th>% Missed</th>
                <th class="grp-start">#</th><th>%</th><th>Worked Hrs</th><th>Call/Hr</th><th>Avg Talk</th><th>Max Talk</th><th>ASA</th><th># Missed</th><th>% Missed</th>

            </thead>
            <tbody>${ringRows}${ringTotalRow}</tbody>
          </table>
        </div>
      </div>

      <div id="people-panel-type" style="display:none">
        <div class="kpi-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px" id="people-type-kpis"></div>
        <div class="chart-row cols-2">
          <div class="chart-card">
            <h3>Type of Call — Week mix</h3>
            <p>Disposition share for W<span id="people-type-week-label">${j.selectedWeek}</span></p>
            <div class="chart-wrap" style="height:260px"><canvas id="people-type-pie"></canvas></div>
          </div>
          <div class="chart-card">
            <h3>Type of Call — Volume</h3>
            <p>Week vs MTD counts by disposition</p>
            <div class="chart-wrap" style="height:260px"><canvas id="people-type-bar"></canvas></div>
          </div>
        </div>
        <div class="chart-row cols-1">
          <div class="chart-card">
            <h3>By agent — Week disposition mix</h3>
            <p>Top agents · stacked by type (hover for counts)</p>
            <div class="chart-wrap" style="height:320px"><canvas id="people-type-agents"></canvas></div>
          </div>
        </div>
        <div class="table-card" style="overflow:auto;margin-top:14px">
          <h3>Summary — Type of Call (detail)</h3>
          <p class="people-note">From TalkDesk Disposition Code · empty = NA · Goal: &lt;20% NA for data quality</p>
          <table class="people-table">
            <thead>
              <tr><th style="text-align:left">Agent</th>${typeHdr}</tr>
            </thead>
            <tbody>
              <tr style="font-weight:600"><td style="text-align:left">Total</td>${typeCells(j.typeOfCall.totals?.week)}</tr>
              ${typeAgentRows}
            </tbody>
          </table>
          <h3 style="margin-top:20px">MTD W${j.mtdFromWeek}–${j.mtdToWeek}</h3>
          <table class="people-table">
            <thead><tr><th>Agent</th>${typeHdr}</tr></thead>
            <tbody>
              <tr style="font-weight:600"><td style="text-align:left">Total</td>${typeCells(j.typeOfCall.totals?.mtd)}</tr>
              ${(j.typeOfCall.agents||[]).map(a => `<tr class="${a.isAi?'ai-row':''}"><td style="text-align:left">${a.isAi?'AI Agent':a.agentName}</td>${typeCols.map(c=>`<td>${fmtNum(a.mtd.types?.[c])}</td>`).join('')}<td>${fmtPct(a.mtd.naPct)}</td><td>${fmtNum(a.mtd.total)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div id="people-panel-peak" style="display:none">
        <div class="kpi-row" style="grid-template-columns:repeat(5,1fr);margin-bottom:14px" id="people-peak-kpis"></div>
        <div class="chart-row cols-2">
          <div class="chart-card">
            <h3>Volume by day — Week ${j.selectedWeek}</h3>
            <p>Inbound (Taken), Outbound, Abandoned, Missed</p>
            <div class="chart-wrap" style="height:280px"><canvas id="people-peak-byday"></canvas></div>
          </div>
          <div class="chart-card">
            <h3>Week total mix</h3>
            <p>Share of call types for the full week</p>
            <div class="chart-wrap" style="height:280px"><canvas id="people-peak-weekmix"></canvas></div>
          </div>
        </div>
        <div class="chart-row cols-1">

            <h3>Inbound by hour of day</h3>

          <p class="people-note">Week ${j.selectedWeek} · Taken = inbound · Missed = missed / outbound_missed / voicemail</p>
          <table class="peak-table">
            <thead>
              <tr><th class="time-col" rowspan="2">Time</th>${peakHdr}</tr>
              <tr>${peakSub}</tr>
            </thead>
            <tbody>${peakRows}${peakTotalRow}</tbody>
          </table>
        </div>
      </div>
    `;

    // stash report for chart renderers when panels open
    window._peopleReport = j;

    document.getElementById('people-week-go')?.addEventListener('click', () => {
      const w = +document.getElementById('people-week').value;
      if (w >= 1 && w <= 53) { F.wkTo = w; document.getElementById('f-wk-to').value = w; renderPeople(); }
    });

    document.querySelectorAll('.people-subtab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.people-subtab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const panel = btn.dataset.peoplePanel;
        ['ring','type','peak'].forEach(p => {
          const node = document.getElementById('people-panel-' + p);
          if (node) node.style.display = p === panel ? '' : 'none';
        });
        if (panel === 'type') requestAnimationFrame(() => renderPeopleTypeCharts(window._peopleReport));
        if (panel === 'peak') requestAnimationFrame(() => renderPeoplePeakCharts(window._peopleReport));
      });
    });

    el.querySelectorAll('.hours-input').forEach(input => {
      input.addEventListener('change', async () => {
        const agentName = input.dataset.agent;
        const period = input.dataset.period;
        const hours = input.value === '' ? null : parseFloat(input.value);
        if (hours != null && (isNaN(hours) || hours < 0)) return;
        try {
          const resp = await fetch('/api/people/worked-hours', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ agentName, period, year: j.year, week: j.selectedWeek, hours }),
          });
          const data = await resp.json();
          if (data.ok) {
            const hint = document.getElementById('people-save-hint');
            if (hint) { hint.textContent = ' · Hours saved'; hint.className = 'save-hint'; setTimeout(() => { hint.textContent = ''; }, 2500); }
            renderPeople();
          }
        } catch (e) {
          console.error('Save worked hours failed', e);
        }
      });
    });
  } catch (e) {
    el.innerHTML = `<div class="error">People report failed: ${e.message}</div>`;
  }
}

const PEOPLE_TYPE_COLORS = {
  'General Inquiry': '#3d8ef8',
  'Other': '#7b82a6',
  'New Reservation': '#34d399',
  'Confirmation': '#a78bfa',
  'Events': '#fbbf24',
  'Cancellation': '#f87171',
  'NA': '#64748b',
};
const PEAK_COLORS = {
  taken: '#34d399',
  outbound: '#3d8ef8',
  abandoned: '#fbbf24',
  missed: '#f87171',
};

function renderPeopleTypeCharts(j) {
  if (!j?.typeOfCall) return;
  const types = j.typeOfCall.types || [];
  const weekT = j.typeOfCall.totals?.week || { types: {}, total: 0, naPct: 0 };
  const mtdT = j.typeOfCall.totals?.mtd || { types: {}, total: 0, naPct: 0 };
  const weekVals = types.map(t => weekT.types?.[t] || 0);
  const mtdVals = types.map(t => mtdT.types?.[t] || 0);
  const colors = types.map(t => PEOPLE_TYPE_COLORS[t] || '#7b82a6');

  const kpi = document.getElementById('people-type-kpis');
  if (kpi) {
    const top = [...types].sort((a,b)=>(weekT.types?.[b]||0)-(weekT.types?.[a]||0))[0] || '—';
    kpi.innerHTML = `
      <div class="kpi"><div class="kpi-label">Week calls typed</div><div class="kpi-value">${(weekT.total||0).toLocaleString()}</div></div>
      <div class="kpi"><div class="kpi-label">MTD calls typed</div><div class="kpi-value">${(mtdT.total||0).toLocaleString()}</div></div>
      <div class="kpi"><div class="kpi-label">% NA (week)</div><div class="kpi-value ${(weekT.naPct||0)>0.2?'dn':'up'}">${((weekT.naPct||0)*100).toFixed(1)}%</div><div class="kpi-sub">Goal &lt;20%</div></div>
      <div class="kpi"><div class="kpi-label">Top type (week)</div><div class="kpi-value" style="font-size:15px">${top}</div></div>`;
  }

  mkChart('people-type-pie','doughnut',{
    labels: types,
    datasets:[{ data: weekVals, backgroundColor: colors.map(c=>c+'cc'), borderColor: colors, borderWidth: 1 }]
  },{plugins:{legend:{display:true,position:'right',labels:{color:'#c8cde0',boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:ctx=>{
    const v=ctx.raw||0; const tot=weekVals.reduce((s,n)=>s+n,0)||1;
    return ` ${ctx.label}: ${v.toLocaleString()} (${(v/tot*100).toFixed(1)}%)`;
  }}}},scales:{x:{display:false},y:{display:false}}});

  mkChart('people-type-bar','bar',{
    labels: types.map(t => t.replace('General ','Gen. ').replace('New ','New\n')),
    datasets:[
      { label:'Week', data: weekVals, backgroundColor: 'rgba(61,142,248,.7)', borderRadius: 4 },
      { label:'MTD', data: mtdVals, backgroundColor: 'rgba(167,139,250,.55)', borderRadius: 4 },
    ]
  },{plugins:{legend:{display:true,labels:{color:'#c8cde0'}}}});

  const agents = (j.typeOfCall.agents||[]).filter(a=>!a.isAi && (a.week?.total||0)>0)
    .sort((a,b)=>(b.week?.total||0)-(a.week?.total||0)).slice(0,10);
  mkChart('people-type-agents','bar',{
    labels: agents.map(a => a.agentName.split(' ')[0]),
    datasets: types.map(t => ({
      label: t,
      data: agents.map(a => a.week?.types?.[t] || 0),
      backgroundColor: (PEOPLE_TYPE_COLORS[t]||'#7b82a6')+'99',
      stack: 's',
    }))
  },{scales:{x:{stacked:true},y:{stacked:true}},plugins:{legend:{display:true,position:'bottom',labels:{color:'#c8cde0',boxWidth:10,font:{size:10}}}}});
}

function renderPeoplePeakCharts(j) {
  if (!j?.peakTimes) return;
  const days = j.peakTimes.days || [];
  const hours = j.peakTimes.hours || [];
  const grid = j.peakTimes.grid || {};
  const tot = j.peakTimes.totals || { taken:0, missed:0, outbound:0, abandoned:0 };
  const grand = j.peakTimes.totalCalls || 1;

  const byDay = days.map(day => {
    let taken=0, missed=0, outbound=0, abandoned=0;
    hours.forEach(h => {
      const c = grid[h]?.[day] || {};
      taken += c.taken||0; missed += c.missed||0; outbound += c.outbound||0; abandoned += c.abandoned||0;
    });
    return { day, taken, missed, outbound, abandoned, total: taken+missed+outbound+abandoned };
  });

  const kpi = document.getElementById('people-peak-kpis');
  if (kpi) {
    kpi.innerHTML = `
      <div class="kpi"><div class="kpi-label">Week volume</div><div class="kpi-value">${grand.toLocaleString()}</div><div class="kpi-sub">All types</div></div>
      <div class="kpi"><div class="kpi-label">Inbound</div><div class="kpi-value" style="color:var(--human)">${(tot.taken||0).toLocaleString()}</div><div class="kpi-sub">${((tot.taken||0)/grand*100).toFixed(1)}%</div></div>
      <div class="kpi"><div class="kpi-label">Outbound</div><div class="kpi-value" style="color:#3d8ef8">${(tot.outbound||0).toLocaleString()}</div><div class="kpi-sub">${((tot.outbound||0)/grand*100).toFixed(1)}%</div></div>
      <div class="kpi"><div class="kpi-label">Abandoned</div><div class="kpi-value" style="color:#fbbf24">${(tot.abandoned||0).toLocaleString()}</div><div class="kpi-sub">${((tot.abandoned||0)/grand*100).toFixed(1)}%</div></div>
      <div class="kpi"><div class="kpi-label">Missed</div><div class="kpi-value" style="color:var(--red)">${(tot.missed||0).toLocaleString()}</div><div class="kpi-sub">${((tot.missed||0)/grand*100).toFixed(1)}%</div></div>`;
  }

  mkChart('people-peak-byday','bar',{
    labels: byDay.map(d => d.day.slice(0,3)),
    datasets:[
      { label:'Inbound', data: byDay.map(d=>d.taken), backgroundColor: PEAK_COLORS.taken+'bb', stack:'s', borderRadius:3 },
      { label:'Outbound', data: byDay.map(d=>d.outbound), backgroundColor: PEAK_COLORS.outbound+'bb', stack:'s', borderRadius:3 },
      { label:'Abandoned', data: byDay.map(d=>d.abandoned), backgroundColor: PEAK_COLORS.abandoned+'bb', stack:'s', borderRadius:3 },
      { label:'Missed', data: byDay.map(d=>d.missed), backgroundColor: PEAK_COLORS.missed+'bb', stack:'s', borderRadius:3 },
    ]
  },{scales:{x:{stacked:true},y:{stacked:true}},plugins:{legend:{display:true,labels:{color:'#c8cde0'}}}});

  mkChart('people-peak-weekmix','doughnut',{
    labels:['Inbound','Outbound','Abandoned','Missed'],
    datasets:[{
      data:[tot.taken||0, tot.outbound||0, tot.abandoned||0, tot.missed||0],
      backgroundColor:[PEAK_COLORS.taken+'cc', PEAK_COLORS.outbound+'cc', PEAK_COLORS.abandoned+'cc', PEAK_COLORS.missed+'cc'],
      borderColor:[PEAK_COLORS.taken, PEAK_COLORS.outbound, PEAK_COLORS.abandoned, PEAK_COLORS.missed],
      borderWidth:1
    }]
  },{plugins:{legend:{display:true,position:'right',labels:{color:'#c8cde0'}},tooltip:{callbacks:{label:ctx=>{
    const v=ctx.raw||0; return ` ${ctx.label}: ${v.toLocaleString()} (${(v/grand*100).toFixed(1)}%)`;
  }}}},scales:{x:{display:false},y:{display:false}}});

  const hourTaken = hours.map(h => days.reduce((s,d)=>s+(grid[h]?.[d]?.taken||0),0));
  mkChart('people-peak-byhour','line',{
    labels: hours,
    datasets:[{
      label:'Inbound',
      data: hourTaken,
      borderColor: PEAK_COLORS.taken,
      backgroundColor: PEAK_COLORS.taken+'22',
      fill:true, tension:.35, borderWidth:2.5, pointRadius:3
    }]
  },{plugins:{legend:{display:false}}});
}

//  CONVERSATION TAB — full AI report + audio sample with listen links
// ═══════════════════════════════════════════════════════════════
let _convSampleCalls = [];
let _convPage = 1;
const CONV_PAGE_SIZE = 25;

function initConvAudioTable(calls) {
  _convSampleCalls = calls || [];
  _convPage = 1;
  const sel = document.getElementById('conv-filter-rest');
  const prev = document.getElementById('conv-prev');
  const next = document.getElementById('conv-next');
  if (sel) sel.onchange = () => { _convPage = 1; renderConvAudioPage(); };
  if (prev) prev.onclick = () => { _convPage--; renderConvAudioPage(); };
  if (next) next.onclick = () => { _convPage++; renderConvAudioPage(); };
  renderConvAudioPage();
}

function renderConvAudioPage() {
  const rest = document.getElementById('conv-filter-rest')?.value || 'all';
  const tbody = document.getElementById('conv-sample-tbody');
  const info = document.getElementById('conv-page-info');
  if (!tbody) return;
  const filtered = _convSampleCalls.filter(c => rest === 'all' || c.restaurant === rest);
  const pages = Math.max(1, Math.ceil(filtered.length / CONV_PAGE_SIZE));
  _convPage = Math.max(1, Math.min(_convPage, pages));
  const slice = filtered.slice((_convPage - 1) * CONV_PAGE_SIZE, _convPage * CONV_PAGE_SIZE);
  if (info) info.textContent = `Page ${_convPage} / ${pages} (${filtered.length} calls)`;
  tbody.innerHTML = slice.map(c => {
    const cat = c.audioCategory || c.category || '—';
    const why = c.audioCategoryWhy || c.categoryWhy || '';
    const play = c.localAudioUrl
      ? `<audio controls preload="none" style="height:28px;max-width:180px"><source src="${c.localAudioUrl}" type="audio/mpeg"></audio>`
      : (c.recordUrl ? `<a href="${c.recordUrl}" target="_blank" rel="noopener">Listen ↗</a>` : '—');
    const tx = c.audioTranscript ? `<div class="stat-note" style="text-align:left;max-width:320px;white-space:normal">${String(c.audioTranscript).slice(0,180)}…</div>` : '';
    return `<tr>
    <td>${(c.startTime||'').replace('T',' ').slice(0,16)}</td>
    <td>${c.restaurant||'—'}</td>
    <td>${c.talkTime||'—'}</td>
    <td><span class="pill pill-cat">${cat}</span>${tx}<div class="stat-note">${why}</div></td>
    <td>${c.listenStatus === 'transcribed' ? '<span class="pill pill-h">audio analyzed</span>' : '<span style="color:var(--muted)">pending</span>'}</td>
    <td>${play}</td>
  </tr>`;
  }).join('');
}

async function renderConversation() {
  const el = document.getElementById('page-conversation');
  if (!el) return;
  el.innerHTML = `<div class="loading">Loading conversation sample…</div>`;
  try {
    const onStaticHost = /github\.io$/i.test(location.hostname) || location.protocol === 'file:';
    let sample = null;
    if (!onStaticHost) {
      sample = await fetchJsonSafe('/api/conversations');
    }
    if (!sample) {
      sample = await fetchJsonSafe(staticAssetUrl('conversations.json') + '?v=20260716c')
        || await fetchJsonSafe('./conversations.json?v=20260716c');
    }
    if (!sample) {
      el.innerHTML = `<div class="conv-build"><div class="pulse">🎧</div><h2>Conversation</h2>
        <div class="status">We are currently listening to calls and analyzing them.</div>
        <p>Audio sample not available on this host yet. Locally run the sample + transcribe pipeline, then re-export the shared dashboard.</p>
        <div class="scope"><b>Step 1:</b> <code class="cmd">npm run conversations:sample</code><br>
        <b>Step 2:</b> <code class="cmd">npm run conversations:transcribe</code><br>
        <b>Step 3:</b> <code class="cmd">npm run dashboard:export</code> and publish</div></div>`;
      return;
    }

    const calls = sample.calls || [];
    const transcribed = sample.transcribedCount ?? calls.filter(c => c.listenStatus === 'transcribed').length;
    const pending = Math.max(0, calls.length - transcribed);
    const listening = pending > 0 || sample.listeningInProgress;
    const byCat = sample.byAudioCategory || sample.byCategory || {};
    const maxCat = Math.max(1, ...Object.values(byCat).map(Number));
    const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `
      <div class="cat-row"><div>${k}</div><div class="cat-track"><div class="cat-fill" style="width:${(+v/maxCat)*100}%"></div></div><div>${v}</div></div>`).join('');

    if (!calls.length) {
      el.innerHTML = `<div class="conv-build"><div class="pulse">🎧</div><h2>Conversation</h2>
        <div class="status">We are currently listening to calls and analyzing them.</div>
        <p>${sample.error || 'Building the 200-call TalkDesk audio sample…'}</p>
        <div class="scope"><b>Step 1:</b> <code class="cmd">npm run conversations:sample</code><br>
        <b>Step 2:</b> <code class="cmd">npm run conversations:transcribe</code></div></div>`;
      return;
    }

    el.innerHTML = `
      ${insightBanner(listening
        ? `<b>🎧 We are currently listening to calls and analyzing them.</b> ${transcribed} of ${calls.length} sample recordings transcribed so far · ${pending} still in the queue. Use <b>Listen</b> links below while analysis continues.`
        : `<b>200 TalkDesk audio recordings</b> from If-No-Answer Agent calls. Listen to each call and review categories from Whisper transcription of the mp3.`)}

      <div class="kpi-row" style="grid-template-columns:repeat(5,1fr)">
        <div class="kpi"><div class="kpi-label">Audio sample</div><div class="kpi-value" style="color:var(--ai)">${calls.length}</div><div class="kpi-sub">TalkDesk mp3 links</div></div>
        <div class="kpi"><div class="kpi-label">Analyzed</div><div class="kpi-value" style="color:var(--human)">${transcribed}</div><div class="kpi-sub">Whisper + LLM</div></div>
        <div class="kpi"><div class="kpi-label">${listening ? 'Listening…' : 'Pool'}</div><div class="kpi-value">${listening ? pending : (sample.totalWithRecordUrl || '—')}</div><div class="kpi-sub">${listening ? 'Still to analyze' : 'AI calls w/ recording'}</div></div>
        <div class="kpi"><div class="kpi-label">Status</div><div class="kpi-value" style="font-size:14px;color:${listening ? 'var(--ai)' : 'var(--human)'}">${listening ? 'In progress' : 'Complete'}</div></div>
        <div class="kpi"><div class="kpi-label">Top reason</div><div class="kpi-value" style="font-size:14px">${Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0]?.[0]?.slice(0,18) || '—'}</div></div>
      </div>

      <div class="chart-row cols-2">
        <div class="chart-card">
          <h3>Why callers leave — from audio transcription</h3>
          <p>${listening ? 'Partial results while we continue listening' : 'Categories after Whisper listens to TalkDesk mp3'} (${transcribed} analyzed)</p>
          <div class="cat-bar">${catRows || '<div style="color:var(--muted)">Analysis in progress — categories appear as transcriptions complete.</div>'}</div>
        </div>
        <div class="chart-card">
          <h3>What we are doing</h3>
          <p style="line-height:1.7;margin:0">
            We are <b>listening</b> to TalkDesk AI call recordings and <b>analyzing</b> them (Whisper transcription + categorization).<br><br>
            ${listening
              ? `Progress: <b>${transcribed}/${calls.length}</b> transcribed. Refresh after the next <code class="cmd">npm run conversations:transcribe</code> run.`
              : `Sample complete. Re-run <code class="cmd">npm run conversations:refresh</code> to pull a fresh 200-call set.`}
          </p>
        </div>
      </div>

      <div class="section-head">200 AI calls — listen &amp; analyze</div>
      <div class="table-card conv-table" id="conv-audio-table">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
          <label style="font-size:12px;color:var(--muted)">Location:</label>
          <select id="conv-filter-rest" style="font-size:12px">
            <option value="all">All</option>
            ${[...new Set(calls.map(c=>c.restaurant))].sort().map(r=>`<option value="${r}">${r}</option>`).join('')}
          </select>
          <span id="conv-page-info" style="font-size:12px;color:var(--muted);margin-left:auto"></span>
          <button type="button" class="rest-btn" style="padding:4px 12px" id="conv-prev">← Prev</button>
          <button type="button" class="rest-btn" style="padding:4px 12px" id="conv-next">Next →</button>
        </div>
        <table>
          <thead><tr><th>When</th><th>Location</th><th>Talk</th><th>Audio analysis</th><th>Status</th><th>Play / Listen</th></tr></thead>
          <tbody id="conv-sample-tbody"></tbody>
        </table>
        <div class="stat-note">${sample.note || ''} · Updated ${sample.generatedAt ? new Date(sample.generatedAt).toLocaleString() : '—'}</div>
      </div>
    `;

    if (calls.length) initConvAudioTable(calls);
  } catch (e) {
    el.innerHTML = `<div class="error">Conversation load failed: ${e.message}</div>`;
  }
}

    if (!j) {
      j = await fetchJsonSafe(staticAssetUrl('sanity.json') + '?v=20260716c')
        || await fetchJsonSafe('./sanity.json?v=20260716c');
    }
    if (!j || !j.sources) {
      el.innerHTML = `<div class="error">Sanity snapshot missing. Run <code class="cmd">npm run dashboard:export</code> and republish.</div>`;
      return;
    }
    const badge = (s) => `<span class="badge badge-${s.status}">${s.status.toUpperCase()}</span>`;
    el.innerHTML = `
      <div class="section-head">Settings — Sanity Check</div>
      ${insightBanner(`Updates are scheduled for <b>every Monday at 8:30 AM</b> via Windows Task <b>${j.schedule?.windowsTaskName || 'RDG Dashboard - Weekly Refresh'}</b>. This page checks whether Hostie, TalkDesk, and OpenTable caches look complete and fresh.${onStaticHost ? ' <b>Shared link shows the last exported snapshot</b> — run sanity locally for live file ages.' : ''}`)}

      <div class="section-head">Schedule</div>
      <div class="table-card">
        <h3>Monday refresh control</h3>
        <table>
          <tbody>
            <tr><td>Expected schedule</td><td>${j.schedule?.expected || 'Monday 8:30 AM'}</td></tr>
            <tr><td>Windows task</td><td><code class="cmd">${j.schedule?.windowsTaskName || '—'}</code></td></tr>
            <tr><td>What it runs</td><td><code class="cmd">scripts/weekly-refresh.ps1</code></td></tr>
            <tr><td>Overall cache health</td><td><span class="badge ${j.ok?'badge-ok':'badge-fail'}">${j.ok?'PASS':'NEEDS ATTENTION'}</span></td></tr>
            <tr><td>Checked at</td><td>${j.generatedAt ? new Date(j.generatedAt).toLocaleString() : '—'}</td></tr>
          </tbody>
        </table>
        <div class="stat-note">Next expected automated run: Monday 8:30 AM. To re-register the task: run <code class="cmd">scripts/setup-scheduler.ps1</code> as Administrator.</div>
      </div>

      <div class="section-head">Source sanity checks</div>
      <div class="sanity-grid">
        ${(j.sources||[]).map(s => `
          <div class="sanity-card">
            <h3>${s.label}</h3>
            ${badge(s)}
            <div class="summary">${s.summary}</div>
            <ul>${(s.details||[]).map(d=>`<li>${d}</li>`).join('')}</ul>
            <div class="stat-note" style="margin-top:10px">${s.expectedUpdate||''}</div>
          </div>`).join('')}
      </div>

      <div class="section-head">What to update (and how)</div>
      <div class="table-card">
        <h3>Manual checklist — if Monday job fails or data looks stale</h3>
        <table class="checklist-table">
          <thead><tr><th>Step</th><th>Command</th><th>Purpose</th></tr></thead>
          <tbody>
            ${(j.checklist||[]).map(c => `<tr><td>${c.step}</td><td><code class="cmd">${c.command}</code></td><td style="text-align:left">${c.purpose}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch (e) {
    el.innerHTML = `<div class="error">Settings load failed: ${e.message}</div>`;
  }
}

// ═══════════════════════════════════════════════════════════════
//  TAB SWITCHING
// ═══════════════════════════════════════════════════════════════
function showTab(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  event.target.classList.add('active');
}

// ─── START ───────────────────────────────────────────────────
init();
</script>
</body>
</html>
